<!DOCTYPE html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>하루 10분 여행 영어</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Jua&family=Noto+Sans+KR:wght@400;700&family=Nunito:wght@700;800&display=swap" rel="stylesheet">
<style>
/* VOICE: 다정하고 또박또박, 큰 글씨와 큰 버튼
IDEA: 여행 가방 속 회화 수첩 — 한 장에 한 문장
PICTURE: 지금 연습 중인 문장 카드 자체 + 머리띠의 말풍선 그림
COLOUR and TYPE: 해바라기 노랑 띠, 잉크, 코랄 강조, 파랑 행동 버튼 / Jua + Noto Sans KR + Nunito
LAYOUT: 한 열, 휴대폰 우선, 760px 안쪽 */
:root{color-scheme:light dark;--bg:light-dark(#fffdf6,#14161b);--ink:light-dark(#1c1b19,#f3f0e8);--soft:light-dark(#6b665c,#b5afa3);--band:light-dark(#ffd84d,#3b3214);--bandInk:light-dark(#1c1b19,#fff1bd);--card:light-dark(#ffffff,#1f2229);--line:light-dark(#ece6d6,#30343d);--acc:light-dark(#d93d30,#ff7a6b);--blue:light-dark(#1f5fbf,#86b4ff);--onblue:light-dark(#ffffff,#0d1a33);--ok:light-dark(#1f7a4d,#6fd3a0);--mine:light-dark(#fff4c2,#3b3214)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:18px/1.6 'Noto Sans KR',system-ui,sans-serif;overflow-x:clip}
button,select{font:inherit}
.band{padding:clamp(22px,4vw,48px) max(5vw,16px)}
main{max-width:760px;margin:0 auto}
.top{background:var(--band);color:var(--bandInk)}
.tw{max-width:760px;margin:auto;display:flex;align-items:center;justify-content:space-between;gap:16px}
.tw svg{width:clamp(120px,32vw,220px);height:auto;flex:none}
.kick{margin:0;font-weight:700;font-size:16px}
h1{font-family:Jua,'Noto Sans KR',sans-serif;font-weight:400;font-size:clamp(36px,8vw,52px);line-height:1.05;margin:4px 0 16px;text-wrap:balance}
.stats{display:flex;gap:28px;flex-wrap:wrap}
.stats span{display:block;font:800 28px/1.1 Nunito,'Noto Sans KR',sans-serif}
.stats small{font-size:14px}
.h2{font-family:Jua,'Noto Sans KR',sans-serif;font-weight:400;font-size:28px;line-height:1.2;margin:0 0 16px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,200px),1fr));gap:12px}
.lesson{text-align:left;background:var(--card);border:2px solid var(--line);border-radius:18px;padding:16px 18px;color:inherit;cursor:pointer;position:relative;min-height:96px}
.lesson b{display:block;font-size:20px;padding-right:44px}
.lesson small{color:var(--soft);font-size:15px}
.lesson.done{border-color:var(--ok)}
.lesson em{position:absolute;top:14px;right:14px;font-style:normal;font-size:13px;font-weight:700;color:var(--ok)}
.review{margin-top:14px;width:100%;min-height:60px;border-radius:16px;border:2px solid var(--acc);background:none;color:var(--acc);font-weight:700;font-size:19px;cursor:pointer;display:flex;justify-content:space-between;align-items:center;padding:0 20px}
.review:disabled{opacity:.45;cursor:default}
.set{border-top:2px solid var(--line)}
.setrow{display:flex;justify-content:space-between;align-items:center;gap:12px;min-height:52px}
.setrow select{min-height:44px;font-size:16px;border-radius:10px;border:2px solid var(--line);background:var(--card);color:var(--ink);padding:0 10px}
.setrow input{width:26px;height:26px;accent-color:var(--blue)}
.note{color:var(--soft);font-size:14px;margin:12px 0 0}
.lvtop{display:flex;flex-direction:column;gap:2px;margin-bottom:12px}
.back{align-self:flex-start;background:none;border:0;color:var(--blue);font-weight:700;font-size:17px;min-height:44px;padding:0;cursor:pointer}
.tabs{display:flex;gap:8px;margin:0 0 16px;overflow-x:auto}
.tab{flex:1;min-height:48px;border-radius:999px;border:2px solid var(--line);background:none;color:var(--ink);font-weight:700;font-size:17px;white-space:nowrap;padding:0 14px;cursor:pointer}
.tab.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.card{background:var(--card);border:2px solid var(--line);border-radius:22px;padding:22px 20px;box-shadow:0 6px 0 var(--line);animation:pop .25s ease-out}
@keyframes pop{from{transform:translateY(8px);opacity:0}to{transform:none;opacity:1}}
@media(prefers-reduced-motion:reduce){.card{animation:none}}
.count,.lab{font-size:15px;color:var(--soft);font-weight:700;margin:0}
.en{font:800 clamp(28px,7vw,38px)/1.2 Nunito,'Noto Sans KR',sans-serif;margin:8px 0 6px;text-wrap:balance}
.en.sm{font-size:21px;margin:2px 0}
.pr{color:var(--blue);font-size:19px;margin:0 0 4px;font-weight:700}
.ko{color:var(--soft);font-size:18px;margin:0}
.big-ko{color:var(--ink);font-size:clamp(24px,6vw,30px);font-weight:700;margin:6px 0 16px;line-height:1.35}
.row{display:flex;gap:10px;margin-top:10px;flex-wrap:wrap}
.big{flex:1;min-height:56px;padding:10px 16px;border-radius:14px;border:2px solid var(--line);background:var(--card);color:var(--ink);font-size:18px;font-weight:700;cursor:pointer}
.big.pri{background:var(--blue);border-color:var(--blue);color:var(--onblue)}
.big.ok{background:var(--ok);border-color:var(--ok);color:var(--onblue)}
.big.wide{width:100%;display:block;margin-top:10px}
.big.sh{border-color:var(--acc);color:var(--acc)}
.big.live{background:var(--acc);border-color:var(--acc);color:#fff}
.big:disabled{opacity:.45;cursor:default}
.state{min-height:1.6em;margin:8px 0 0;font-weight:700;color:var(--acc);text-align:center}
.check{margin-top:10px}
.check p{margin:4px 0}
.check .bad{background:light-dark(#ffd9d4,#5a1f19);border-radius:4px;padding:0 3px;text-decoration:underline wavy var(--acc)}
.pct{font:800 24px Nunito,'Noto Sans KR',sans-serif}
.star{margin-top:12px;background:none;border:0;color:var(--soft);text-decoration:underline;font-size:16px;min-height:44px;cursor:pointer;padding:0}
.star.on{color:var(--acc)}
.nav{display:flex;gap:10px;margin-top:18px}
.chat{display:flex;flex-direction:column;gap:10px}
.bub{max-width:88%;padding:12px 16px;border-radius:18px;background:var(--card);border:2px solid var(--line)}
.bub.them{align-self:flex-start;border-bottom-left-radius:6px}
.bub.me{align-self:flex-end;background:var(--mine);border-color:transparent;border-bottom-right-radius:6px}
.bub.ask{max-width:100%;align-self:stretch;border:2px dashed var(--acc);background:var(--card)}
.who{margin:0;font-size:13px;font-weight:700;color:var(--soft)}
#toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:12px 18px;border-radius:12px;font-size:16px;width:max-content;max-width:90vw;opacity:0;pointer-events:none;transition:opacity .2s;z-index:9}
#toast.show{opacity:1}
:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
@media(max-width:600px){.tw svg{width:110px}.stats{gap:20px}}
</style></head><body>

const store={get(k,d){try{const v=localStorage.getItem('eng10_'+k);return v?JSON.parse(v):d}catch(e){return d}},set(k,v){try{localStorage.setItem('eng10_'+k,JSON.stringify(v))}catch(e){}}};
const hard=new Set(store.get('hard',[]));const done=new Set(store.get('done',[]));let days=store.get('days',[]);

const hasTTS='speechSynthesis' in window;let voice=null;
function pickVoice(){const vs=speechSynthesis.getVoices().filter(v=>/^en[-_]/i.test(v.lang));voice=vs.find(v=>/en[-_]US/i.test(v.lang)&&/google/i.test(v.name))||vs.find(v=>/en[-_]US/i.test(v.lang))||vs[0]||null}
if(hasTTS){pickVoice();speechSynthesis.onvoiceschanged=pickVoice}
function say(t,r,onend){if(!hasTTS||!t){toast('이 기기에서는 소리 재생이 안 돼요');return}speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang='en-US';if(voice)u.voice=voice;u.rate=r||rate;if(onend)u.onend=onend;speechSynthesis.speak(u)}
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('show');clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove('show'),3500)}
function stopAll(){shadowRun++;if(hasTTS)speechSynthesis.cancel();if(rec&&rec.state==='recording'){rec.discard=true;rec.stop()}}
const shuffle=a=>{for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const dstr=d=>d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate();
function markDay(){const t=dstr(new Date());if(!days.includes(t)){days.push(t);days=days.slice(-90);store.set('days',days);stats()}}
function streak(){let n=0;const d=new Date();if(!days.includes(dstr(d)))d.setDate(d.getDate()-1);while(days.includes(dstr(d))){n++;d.setDate(d.getDate()-1)}return n}
function stats(){$('#stStreak').textContent=streak()+'일';$('#stDone').textContent=done.size+' / '+L.length}
function finishLesson(){if(cur.i>=0){done.add(cur.i);store.set('done',[...done])}markDay();stats()}

function home(){stopAll();cur=null;
 $('#app').innerHTML=`<section class="band"><h2 class="h2">어떤 상황을 연습할까요?</h2>
 <div class="grid">${L.map(l=>`<button class="lesson ${done.has(l.i)?'done':''}" data-act="open" data-i="${l.i}"><b>${l.t}</b><small>${l.s}</small>${done.has(l.i)?'<em>완료</em>':''}</button>`).join('')}</div>

 <section class="band set">
 <div class="setrow"><label for="rate">말하기 속도</label><select id="rate"><option value="0.6">아주 천천히</option><option value="0.8">천천히</option><option value="1">보통</option></select></div>
 <div class="setrow"><label for="pron">한글 발음 보기</label><input type="checkbox" id="pron"></div>

 $('#rate').value=String(rate);$('#pron').checked=showPron;stats();window.scrollTo(0,0)}

function reviewLesson(){const ps=[];L.forEach(l=>l.phrases.forEach(p=>{if(hard.has(p.key))ps.push(p)}));return{t:'어려운 문장 복습',phrases:ps,i:-1}}
function open(i){stopAll();cur=i===-1?reviewLesson():L[i];if(!cur.phrases.length)return home();mode='learn';idx=0;lview();window.scrollTo(0,0)}
function lview(){stopAll();const tabs=[['learn','문장 익히기'],['quiz','말하기 퀴즈']];if(cur.d)tabs.push(['role','상황극']);

 if(mode==='learn')renderLearn();else if(mode==='quiz')startQuiz();else startRole()}

function renderLearn(){stopAll();const ps=cur.phrases;idx=Math.max(0,Math.min(idx,ps.length-1));const p=ps[idx];if(recUrl){URL.revokeObjectURL(recUrl);recUrl=null}
 $('#pane').innerHTML=`<div class="card"><p class="count">${idx+1} / ${ps.length}</p><p class="en">${p.en}</p>${showPron?`<p class="pr">${p.pr}</p>`:''}<p class="ko">${p.ko}</p>

function shadow(text){const run=++shadowRun;let n=0;const st=()=>$('#shadowState');
 const step=()=>{if(run!==shadowRun||!st())return;if(n>=3){st().textContent='잘하셨어요! 다시 하려면 한 번 더 누르세요';return}n++;st().textContent=n+'/3 · 잘 들어보세요';const t0=Date.now();
  say(text,rate,()=>{if(run!==shadowRun||!st())return;const wait=Math.max(1800,(Date.now()-t0)*1.5+700);st().textContent=n+'/3 · 지금 따라 말해보세요';setTimeout(step,wait)})};step()}

function setRec(blob){if(recUrl)URL.revokeObjectURL(recUrl);recUrl=URL.createObjectURL(blob);const m=$('#mineBtn');if(m)m.disabled=false;toast('녹음됐어요. "내 목소리 듣기"를 눌러 원래 문장과 비교해보세요')}
async function record(btn){
 if(rec&&rec.state==='recording'){rec.stop();return}
 if(micBlocked||!navigator.mediaDevices||!window.MediaRecorder){$('#fileRec').click();return}
 try{const s=await navigator.mediaDevices.getUserMedia({audio:true});const ch=[];const r=new MediaRecorder(s);rec=r;
  r.ondataavailable=e=>{if(e.data.size)ch.push(e.data)};
  r.onstop=()=>{s.getTracks().forEach(t=>t.stop());const b=$('#recBtn');if(b){b.textContent='다시 녹음';b.classList.remove('live')}if(!r.discard)setRec(new Blob(ch,{type:r.mimeType||'audio/webm'}))};
  r.start();btn.textContent='녹음 멈추기';btn.classList.add('live')}
 catch(err){micBlocked=true;toast('여기선 바로 녹음이 안 돼요. 한 번 더 누르면 휴대폰 녹음기로 녹음할 수 있어요')}}
$('#fileRec').addEventListener('change',e=>{const f=e.target.files&&e.target.files[0];if(f)setRec(f);e.target.value=''});

const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
const NUM={two:'2',three:'3',five:'5',six:'6',seven:'7',ten:'10',twenty:'20',fifty:'50'};
const norm=s=>s.toLowerCase().replace(/wi-?fi/g,'wifi').replace(/['’]/g,'').replace(/[^a-z0-9 ]/g,' ').split(/\s+/).filter(Boolean).map(w=>NUM[w]||w);
function score(target,heard){const h=new Set(norm(heard));const marks=target.split(/\s+/).map(w=>{const k=norm(w)[0];return{w,ok:!k||h.has(k)}});return{pct:Math.round(100*marks.filter(m=>m.ok).length/marks.length),marks,heard}}
function check(text){const out=$('#checkOut');if(!SR){out.innerHTML='<p>이 화면에서는 발음 체크를 쓸 수 없어요.</p>';return}
 let r;try{r=new SR()}catch(e){out.innerHTML='<p>이 화면에서는 발음 체크를 쓸 수 없어요.</p>';return}
 r.lang='en-US';r.interimResults=false;r.maxAlternatives=3;out.innerHTML='<p class="pct">듣고 있어요… 말해보세요</p>';
 r.onresult=e=>{const alts=[...e.results[0]].map(a=>a.transcript);const b=alts.map(a=>score(text,a)).sort((x,y)=>y.pct-x.pct)[0];
  out.innerHTML=`<p class="pct">${b.pct===100?'완벽해요!':b.pct>=70?'좋아요! 거의 다 왔어요':'한 번 더 해볼까요?'}</p><p>${b.marks.map(m=>m.ok?esc(m.w):`<span class="bad">${esc(m.w)}</span>`).join(' ')}</p><p class="ko">들린 말: ${esc(b.heard)}</p>`;markDay()};
 r.onerror=e=>{out.innerHTML=/not-allowed/.test(e.error)?'<p>이 화면에서는 마이크를 쓸 수 없어요. 듣기와 따라 말하기로 연습해 주세요.</p>':'<p>잘 못 들었어요. 조금 크게 다시 말해볼까요?</p>'};
 try{r.start()}catch(e){out.innerHTML='<p>잠시 후 다시 눌러주세요.</p>'}}

  <div class="row">${rShown?'<button class="big" data-act="say">다시 듣기</button><button class="big pri" data-act="rnext">다음</button>':'<button class="big wide pri" data-act="rshow">말했어요, 정답 보기</button>'}</div>`}

 const last=$('#pane .row:last-child')||$('#pane .card');if(last)last.scrollIntoView({block:'end',behavior:'smooth'});
 if(ri<d.length&&d[ri][0]==='t')say(d[ri][1]);markDay()}

function curText(){if(mode==='learn')return cur.phrases[idx].en;if(mode==='quiz')return qo[qi]?qo[qi].en:'';const l=cur.d[ri];return l?l[1]:''}

document.addEventListener('click',e=>{const b=e.target.closest('[data-act]');if(!b||b.disabled)return;
 switch(b.dataset.act){
 case'home':home();break;
 case'open':open(+b.dataset.i);break;
 case'review':open(-1);break;
 case'mode':mode=b.dataset.m;lview();break;
 case'say':say(curText());break;
 case'slow':say(curText(),Math.max(0.45,rate-0.25));break;
 case'shadow':shadow(curText());break;
 case'rec':record(b);break;
 case'mine':if(recUrl){new Audio(recUrl).play().catch(()=>toast('재생이 안 됐어요. 다시 눌러주세요'))}break;
 case'check':check(curText());break;
 case'star':{const k=cur.phrases[idx].key;if(hard.has(k))hard.delete(k);else hard.add(k);saveHard();renderLearn();break}
 case'prev':idx--;renderLearn();break;
 case'next':if(idx<cur.phrases.length-1){idx++;renderLearn()}else{mode='quiz';lview()}window.scrollTo(0,0);break;
 case'reveal':qShown=true;renderQuiz();say(qo[qi].en);break;
 case'qright':qRight++;if(cur.i===-1){hard.delete(qo[qi].key);saveHard()}qi++;qShown=false;renderQuiz();break;
 case'qwrong':hard.add(qo[qi].key);saveHard();qi++;qShown=false;renderQuiz();break;
 case'qagain':startQuiz();break;
 case'rshow':rShown=true;renderRole();say(cur.d[ri][1]);break;
 case'rnext':ri++;rShown=false;renderRole();break;
 case'ragain':startRole();break;
 }});
document.addEventListener('change',e=>{if(e.target.id==='rate'){rate=+e.target.value;store.set('rate',rate);say('This is the speed.',rate)}if(e.target.id==='pron'){showPron=e.target.checked;store.set('pron',showPron)}});
home();
}
</script></body></html>
