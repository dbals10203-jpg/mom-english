<!DOCTYPE html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>하루 10분 생활 영어</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Jua&family=Noto+Sans+KR:wght@400;700&family=Nunito:wght@700;800&display=swap" rel="stylesheet">
<style>
/* VOICE: 밝고 귀엽고 다정하게, 큰 글씨와 큰 버튼
IDEA: 주제마다 얼굴이 있는 동글동글 캐릭터 친구
PICTURE: 오늘의 학습 카드 + 100칸 진도표
COLOUR and TYPE: 흰 바탕, 상황별 파스텔, 보라 행동색 / Jua + Noto Sans KR + Nunito
LAYOUT: 한 열, 휴대폰 2열 카드, 760px 안쪽 */
:root{color-scheme:light;--bg:#faf8ff;--ink:#22202a;--soft:#6e6a7c;--card:#ffffff;--line:#ece8f5;--pur:#7b4ce0;--pur2:#f1ecff;--acc:#e8553b;--peach:#ffe8dc;--ok:#18a385;--mine:#f1ecff}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:18px/1.6 'Noto Sans KR',system-ui,sans-serif;overflow-x:clip}
button,select{font:inherit}
main{max-width:760px;margin:0 auto}
.band{padding:clamp(18px,4vw,40px) max(5vw,16px)}
.top{padding:clamp(22px,4vw,40px) max(5vw,16px) 6px}
.tw{max-width:760px;margin:auto}
.kick{margin:0;font-weight:700;font-size:16px;color:var(--soft)}
h1{font-family:Jua,'Noto Sans KR',sans-serif;font-weight:400;font-size:clamp(34px,8vw,48px);line-height:1.1;margin:2px 0 16px}
.cheer{display:flex;align-items:center;gap:14px;background:var(--pur);color:#fff;border-radius:24px;padding:14px 20px 14px 12px}
.cheer svg{width:86px;height:86px;flex:none}
.cheer b{display:block;font-family:Jua,'Noto Sans KR',sans-serif;font-weight:400;font-size:24px;line-height:1.25}
.cheer small{font-size:15px;opacity:.9}
.h2{font-family:Jua,'Noto Sans KR',sans-serif;font-weight:400;font-size:26px;line-height:1.2;margin:0 0 14px}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
@media(min-width:620px){.grid{grid-template-columns:repeat(3,minmax(0,1fr))}}
.lesson{text-align:left;background:var(--bg2);border:0;border-radius:22px;padding:12px 14px 16px;color:var(--ink);cursor:pointer;position:relative;display:flex;flex-direction:column;align-items:flex-start;transition:transform .15s}
.lesson:active{transform:scale(.97)}
.lesson .chr{width:64px;height:64px;margin-bottom:6px}
.lesson b{font-size:19px;line-height:1.3;word-break:keep-all}
.lesson small{color:#4f4b5c;font-size:14px;line-height:1.35;word-break:keep-all;margin-top:2px}
.lesson em{position:absolute;top:12px;right:12px;font-style:normal;font-size:13px;font-weight:700;background:#fff;color:var(--ok);border-radius:999px;padding:2px 10px}
.review{margin-top:14px;width:100%;min-height:62px;border-radius:20px;border:0;background:var(--peach);color:#b8401f;font-weight:700;font-size:19px;cursor:pointer;display:flex;justify-content:space-between;align-items:center;padding:0 20px}
.review:disabled{opacity:.5;cursor:default}
.set{padding-top:4px}
.setbox{background:var(--card);border-radius:20px;padding:6px 18px}
.setrow{display:flex;justify-content:space-between;align-items:center;gap:12px;min-height:56px}
.setrow+.setrow{border-top:1px solid var(--line)}
.setrow select{min-height:44px;font-size:16px;border-radius:12px;border:2px solid var(--line);background:#fff;color:var(--ink);padding:0 10px}
.setrow input{width:26px;height:26px;accent-color:var(--pur)}
.note{color:var(--soft);font-size:14px;margin:12px 4px 0}
.lvtop{display:flex;align-items:center;gap:12px;margin-bottom:12px}
.lvtop .chr{width:58px;height:58px;flex:none}
.lvtop .h2{margin:0}
.back{background:var(--card);border:0;border-radius:14px;color:var(--pur);font-weight:700;font-size:17px;min-height:48px;padding:0 16px;cursor:pointer;margin-bottom:10px}
.tabs{display:flex;gap:6px;margin:0 0 16px;background:var(--pur2);padding:5px;border-radius:999px}
.tab{flex:1;min-height:48px;border-radius:999px;border:0;background:none;color:var(--pur);font-weight:700;font-size:16px;white-space:nowrap;padding:0 8px;cursor:pointer}
.tab.on{background:var(--pur);color:#fff}
.card{background:var(--card);border-radius:26px;padding:22px 20px;box-shadow:0 8px 24px rgba(80,60,140,.08);animation:pop .25s ease-out}
@keyframes pop{from{transform:translateY(8px);opacity:0}to{transform:none;opacity:1}}
@media(prefers-reduced-motion:reduce){.card{animation:none}.lesson{transition:none}}
.count,.lab{font-size:15px;color:var(--soft);font-weight:700;margin:0}
.en{font:800 clamp(27px,7vw,36px)/1.25 Nunito,'Noto Sans KR',sans-serif;margin:8px 0 6px;text-wrap:balance}
.en.sm{font-size:21px;margin:2px 0}
.pr{color:var(--pur);font-size:19px;margin:0 0 4px;font-weight:700}
.ko{color:var(--soft);font-size:18px;margin:0}
.big-ko{color:var(--ink);font-size:clamp(24px,6vw,30px);font-weight:700;margin:6px 0 16px;line-height:1.35;word-break:keep-all}
.row{display:flex;gap:10px;margin-top:10px;flex-wrap:wrap}
.big{flex:1;min-height:58px;padding:10px 16px;border-radius:18px;border:0;background:var(--pur2);color:var(--pur);font-size:18px;font-weight:700;cursor:pointer}
.big.pri{background:var(--pur);color:#fff}
.big.ok{background:var(--ok);color:#fff}
.big.wide{width:100%;display:block;margin-top:10px}
.big.sh{background:var(--peach);color:#b8401f}
.big.live{background:var(--acc);color:#fff}
.big:disabled{opacity:.4;cursor:default}
.state{min-height:1.6em;margin:8px 0 0;font-weight:700;color:#b8401f;text-align:center}
.check{margin-top:10px}
.check p{margin:4px 0}
.check .bad{background:#ffe0da;border-radius:4px;padding:0 3px;text-decoration:underline wavy var(--acc)}
.pct{font:800 24px Nunito,'Noto Sans KR',sans-serif}
.star{margin-top:12px;background:none;border:0;color:var(--soft);text-decoration:underline;font-size:16px;min-height:44px;cursor:pointer;padding:0}
.star.on{color:var(--acc)}
.nav{display:flex;gap:10px;margin-top:18px}
.chat{display:flex;flex-direction:column;gap:10px}
.bub{max-width:88%;padding:12px 16px;border-radius:20px;background:var(--card);box-shadow:0 4px 14px rgba(80,60,140,.07)}
.bub.them{align-self:flex-start;border-bottom-left-radius:6px}
.bub.me{align-self:flex-end;background:var(--mine);border-bottom-right-radius:6px;box-shadow:none}
.bub.ask{max-width:100%;align-self:stretch;border:2px dashed var(--pur);background:var(--card)}
.who{margin:0;font-size:13px;font-weight:700;color:var(--soft)}
#toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:12px 18px;border-radius:14px;font-size:16px;width:max-content;max-width:90vw;opacity:0;pointer-events:none;transition:opacity .2s;z-index:9}
#toast.show{opacity:1}
.in .top{display:none}
:focus-visible{outline:3px solid var(--pur);outline-offset:2px}

.today{border-radius:28px;padding:20px;background:var(--bg2);display:flex;flex-direction:column;gap:6px;position:relative}
.today .chr{width:92px;height:92px;position:absolute;right:16px;top:16px}
.today .tag{font-weight:700;font-size:15px;color:#4f4b5c;margin:0}
.today .tt{font-family:Jua,'Noto Sans KR',sans-serif;font-size:clamp(28px,7vw,36px);line-height:1.15;margin:0;padding-right:100px;word-break:keep-all}
.today .ut{margin:0;color:#4f4b5c;font-size:16px}
.today .big{margin-top:12px}
.today .msg{margin:10px 0 0;font-weight:700;font-size:18px;color:var(--ink)}
.units{display:flex;flex-direction:column;gap:12px}
.unit{background:var(--card);border-radius:20px;padding:14px 16px}
.unit h3{margin:0 0 10px;font-size:17px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.unit h3 .dot{width:14px;height:14px;border-radius:50%;flex:none}
.days{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px}
.dchip{min-height:48px;border-radius:14px;border:2px solid var(--line);background:#fff;color:var(--ink);font:800 17px Nunito,'Noto Sans KR',sans-serif;cursor:pointer;padding:0}
.dchip.done{background:var(--c);border-color:var(--c);color:#fff}
.dchip.now{border-color:var(--pur);color:var(--pur);box-shadow:0 0 0 2px var(--pur) inset}
.dchip:disabled{opacity:.35;cursor:default;background:#f4f2f8}
.more{width:100%;margin-top:12px;min-height:52px;border-radius:16px;border:0;background:var(--pur2);color:var(--pur);font-weight:700;font-size:17px;cursor:pointer}
.sub{font-weight:700;color:var(--soft);font-size:15px;margin:0}
</style></head><body>
<header class="top"><div class="tw">
 <p class="kick">엄마의 영어 연습장</p><h1>하루 10분 생활 영어</h1>
 <div class="cheer"><span id="cheerFace"></span><div><b id="stStreak">오늘 첫 연습을 시작해볼까요?</b><small id="stDone">100일 코스</small></div></div>
</div></header>
<main id="app"></main>
<input type="file" id="fileRec" accept="audio/*" capture hidden>
<div id="toast" role="status"></div>
<script>
{
const UNITS=[{"t":"인사와 안부","days":[{"t":"반갑게 인사하기","p":[["Good morning! How are you today?","좋은 아침이에요! 오늘 어떠세요?","굿 모닝! 하우 아 유 투데이"],["I'm doing well, thanks. And you?","잘 지내요, 고마워요. 당신은요?","아임 두잉 웰, 땡스. 앤 유"],["Not bad. Just a little tired.","나쁘지 않아요. 그냥 좀 피곤해요.","낫 배드. 저스트 어 리틀 타이어드"],["It's nice to see you again.","다시 보니 반가워요.","잇츠 나이스 투 씨 유 어게인"],["Have a good day!","좋은 하루 보내세요!","해브 어 굿 데이"]],"d":[["t","Good morning! How are you today?","좋은 아침이에요! 오늘 어떠세요?"],["m","I'm doing well, thanks. And you?","잘 지내요, 고마워요. 당신은요?"],["t","Not bad. Just a little tired.","나쁘지 않아요. 그냥 좀 피곤해요."],["m","It's nice to see you again.","다시 보니 반가워요."],["t","You too! Have a good day!","저도요! 좋은 하루 보내세요!"],["m","Thanks, you too. Have a good day!","고마워요, 당신도요. 좋은 하루 보내세요!"]]},{"t":"오랜만에 만났을 때","p":[["Long time no see!","오랜만이에요!","롱 타임 노 씨"],["How have you been?","그동안 어떻게 지냈어요?","하우 해브 유 빈"],["I've been busy with work.","일 때문에 바빴어요.","아이브 빈 비지 윗 웍"],["You look great!","좋아 보이세요!","유 룩 그레잇"],["What's new with you?","요즘 별일 없어요?","왓츠 뉴 윗 유"]],"d":[["t","Long time no see!","오랜만이에요!"],["m","Long time no see! How have you been?","오랜만이에요! 그동안 어떻게 지냈어요?"],["t","I've been busy with work. And you?","일 때문에 바빴어요. 당신은요?"],["m","I've been good. You look great!","잘 지냈어요. 좋아 보이세요!"],["t","Thank you! What's new with you?","고마워요! 요즘 별일 없어요?"],["m","Nothing much. Same as usual.","별일 없어요. 늘 똑같죠."]]},{"t":"헤어질 때 인사","p":[["I have to go now.","이제 가봐야 해요.","아이 해브 투 고 나우"],["It was great talking to you.","얘기 나눠서 정말 좋았어요.","잇 워즈 그레잇 토킹 투 유"],["Let's keep in touch.","계속 연락하고 지내요.","렛츠 킵 인 터치"],["See you next week.","다음 주에 봐요.","씨 유 넥스트 위크"],["Take care!","잘 지내요!","테이크 케어"]],"d":[["m","I have to go now.","이제 가봐야 해요."],["t","Already? It was great talking to you.","벌써요? 얘기 나눠서 정말 좋았어요."],["m","Me too. Let's keep in touch.","저도요. 계속 연락하고 지내요."],["t","Sure. See you next week.","그래요. 다음 주에 봐요."],["m","See you next week. Take care!","다음 주에 봐요. 잘 지내요!"]]},{"t":"고마움 표현하기","p":[["Thank you so much.","정말 고마워요.","땡큐 쏘 머치"],["I really appreciate it.","정말 감사해요.","아이 리얼리 어프리시에잇 잇"],["That's very kind of you.","정말 친절하시네요.","댓츠 베리 카인드 오브 유"],["You're welcome.","천만에요.","유어 웰컴"],["No problem at all.","별말씀을요.","노 프라블럼 앳 올"]],"d":[["t","Here, let me help you with that bag.","자, 그 가방 들어드릴게요."],["m","Thank you so much. That's very kind of you.","정말 고마워요. 정말 친절하시네요."],["t","No problem at all.","별말씀을요."],["m","I really appreciate it.","정말 감사해요."],["t","You're welcome. Have a nice day!","천만에요. 좋은 하루 보내세요!"]]},{"t":"사과하기","p":[["I'm sorry I'm late.","늦어서 미안해요.","아임 쏘리 아임 레잇"],["Sorry, it was my mistake.","미안해요, 제 실수였어요.","쏘리, 잇 워즈 마이 미스테이크"],["I didn't mean to do that.","일부러 그런 건 아니에요.","아이 디든트 민 투 두 댓"],["That's okay. Don't worry about it.","괜찮아요. 신경 쓰지 마세요.","댓츠 오케이. 돈트 워리 어바웃 잇"],["It's not a big deal.","별일 아니에요.","잇츠 낫 어 빅 딜"]],"d":[["m","I'm sorry I'm late.","늦어서 미안해요."],["t","That's okay. Don't worry about it.","괜찮아요. 신경 쓰지 마세요."],["m","The traffic was terrible.","차가 엄청 막혔어요."],["t","It's not a big deal. We just got here, too.","별일 아니에요. 우리도 방금 왔어요."],["m","Thank you for waiting.","기다려줘서 고마워요."]]},{"t":"부탁하기","p":[["Can you do me a favor?","부탁 하나 들어줄 수 있어요?","캔 유 두 미 어 페이버"],["Could you help me with this?","이것 좀 도와줄 수 있어요?","쿠쥬 헬프 미 윗 디스"],["Would you mind closing the window?","창문 좀 닫아줄래요?","우쥬 마인드 클로징 더 윈도우"],["Sure, no problem.","그럼요, 문제없어요.","슈어, 노 프라블럼"],["Thanks for your help.","도와줘서 고마워요.","땡스 포 유어 헬프"]],"d":[["m","Can you do me a favor?","부탁 하나 들어줄 수 있어요?"],["t","Sure, no problem. What is it?","그럼요, 문제없어요. 뭔데요?"],["m","Could you help me with this? It's too heavy.","이것 좀 도와줄 수 있어요? 너무 무거워요."],["t","Of course. Where do you want it?","물론이죠. 어디에 둘까요?"],["m","Over there, please. Thanks for your help.","저쪽에 놔주세요. 도와줘서 고마워요."]]},{"t":"맞장구치기","p":[["Really?","정말요?","리얼리"],["That's great!","잘됐네요!","댓츠 그레잇"],["That's too bad.","그거 참 안됐네요.","댓츠 투 배드"],["I know what you mean.","무슨 말인지 알아요.","아이 노우 왓 유 민"],["I think so, too.","저도 그렇게 생각해요.","아이 띵크 쏘, 투"]],"d":[["t","I finally got a new job!","드디어 새 직장을 구했어요!"],["m","Really? That's great!","정말요? 잘됐네요!"],["t","But it's far from my house.","그런데 집에서 멀어요."],["m","That's too bad.","그거 참 안됐네요."],["t","Long commutes are so tiring.","출퇴근이 길면 너무 피곤해요."],["m","I know what you mean.","무슨 말인지 알아요."]]},{"t":"다시 물어보기","p":[["Sorry?","네? 뭐라고요?","쏘리"],["Could you say that again?","다시 말해줄래요?","쿠쥬 세이 댓 어게인"],["What does that mean?","그게 무슨 뜻이에요?","왓 더즈 댓 민"],["How do you spell that?","철자가 어떻게 돼요?","하우 두 유 스펠 댓"],["Please speak a little slowly.","조금 천천히 말해주세요.","플리즈 스픽 어 리틀 슬로울리"]],"d":[["t","My name is Siobhan.","제 이름은 시오반이에요."],["m","Sorry? Could you say that again?","네? 다시 말해줄래요?"],["t","Siobhan. It's an Irish name.","시오반이요. 아일랜드 이름이에요."],["m","How do you spell that?","철자가 어떻게 돼요?"],["t","S, I, O, B, H, A, N.","S, I, O, B, H, A, N이요."],["m","Thank you. It's a beautiful name.","고마워요. 예쁜 이름이네요."]]},{"t":"칭찬하기","p":[["I like your bag.","가방 예쁘네요.","아이 라이크 유어 백"],["That color looks good on you.","그 색 잘 어울려요.","댓 컬러 룩스 굿 온 유"],["You're a great cook.","요리 정말 잘하시네요.","유어 어 그레잇 쿡"],["Where did you get it?","어디서 샀어요?","웨어 디쥬 겟 잇"],["Thank you for saying that.","그렇게 말해줘서 고마워요.","땡큐 포 세잉 댓"]],"d":[["m","I like your bag.","가방 예쁘네요."],["t","Thank you! I just bought it.","고마워요! 막 샀어요."],["m","Where did you get it?","어디서 샀어요?"],["t","At the department store downtown.","시내 백화점에서요."],["m","That color looks good on you.","그 색 잘 어울려요."],["t","Thank you for saying that.","그렇게 말해줘서 고마워요."]]},{"t":"새 이웃과 인사하기","p":[["Hi, I'm Hyunsook. I live next door.","안녕하세요, 저는 현숙이에요. 옆집에 살아요.","하이, 아임 현숙. 아이 리브 넥스트 도어"],["Nice to meet you, too.","저도 만나서 반가워요.","나이스 투 밋 유, 투"],["How long have you lived here?","여기 사신 지 얼마나 됐어요?","하우 롱 해브 유 리브드 히어"],["Let me know if you need anything.","필요한 거 있으면 말씀하세요.","렛 미 노우 이프 유 니드 애니띵"],["I'm glad we met.","이렇게 만나서 반가워요.","아임 글래드 위 멧"]],"d":[["m","Hi, I'm Hyunsook. I live next door.","안녕하세요, 저는 현숙이에요. 옆집에 살아요."],["t","Hi! I'm Sarah. Nice to meet you.","안녕하세요! 저는 사라예요. 만나서 반가워요."],["m","Nice to meet you, too. How long have you lived ","아들은 키가 크고 착해요.","마이 썬 이즈 톨 앤 카인드"],["He takes after his father.","그 애는 아빠를 닮았어요.","히 테익스 애프터 히즈 파더"],["She's very funny and cheerful.","그 애는 정말 재밌고 밝아요.","쉬즈 베리 퍼니 앤 치어풀"],["I'm so proud of them.","아이들이 정말 자랑스러워요.","아임 쏘 프라우드 오브 뎀"]],"d":[["t","Is this your family photo?","이거 가족사진이에요?"],["m","Yes. My daughter looks like me.","네. 딸은 저를 닮았어요."],["t","She has your smile! What's she like?","미소가 똑같네요! 어떤 성격이에요?"],["m","She's very funny and cheerful.","정말 재밌고 밝아요."],["t","And your son?","아드님은요?"],["m","My son is tall and kind. He takes after his father.","아들은 키가 크고 착해요. 아빠를 닮았어요."],["t","You must be proud.","정말 자랑스럽겠어요."],["m","I'm so proud of them.","아이들이 정말 자랑스러워요."]]},{"t":"우리 동네","p":[["I live in an apartment.","아파트에 살아요.","아이 리브 인 언 아파트먼트"],["It's near the subway station.","지하철역 근처예요.","잇츠 니어 더 서브웨이 스테이션"],["There's a nice park nearby.","근처에 좋은 공원이 있어요.","데어즈 어 나이스 파크 니어바이"],["It's quiet and convenient.","조용하고 편리해요.","잇츠 콰이엇 앤 컨비니언트"],["I've lived there for ten years.","거기서 10년 살았어요.","아이브 리브드 데어 포 텐 이어즈"]],"d":[["t","Where do you live?","어디 사세요?"],["m","I live in an apartment. It's near the subway station.","아파트에 살아요. 지하철역 근처예요."],["t","Do you like your neighborhood?","동네 마음에 들어요?"],["m","Yes. It's quiet and convenient.","네. 조용하고 편리해요."],["t","How long have you lived there?","거기 산 지 얼마나 됐어요?"],["m","I've lived there for ten years.","거기서 10년 살았어요."],["t","Wow, that's a long time.","와, 오래됐네요."],["m","There's a nice park nearby, too.","근처에 좋은 공원도 있어요."]]},{"t":"무슨 일을 하세요?","p":[["What kind of work do you do?","어떤 일을 하세요?","왓 카인드 오브 웍 두 유 두"],["I take care of my home and family.","집안일과 가족을 돌봐요.","아이 테이크 케어 오브 마이 홈 앤 패밀리"],["I used to work at a bank.","예전에 은행에서 일했어요.","아이 유스트 투 웍 앳 어 뱅크"],["These days, I have more free time.","요즘엔 시간이 더 많아요.","디즈 데이즈, 아이 해브 모어 프리 타임"],["That must be hard work.","힘든 일이겠네요.","댓 머스트 비 하드 웍"]],"d":[["t","So, what do you do?","그런데, 무슨 일 하세요?"],["m","I take care of my home and family. I used to work at a bank.","집안일과 가족을 돌봐요. 예전에 은행에서 일했어요."],["t","Oh, really?","아, 정말요?"],["m","Yes. These days, I have more free time. What kind of work do you do?","네. 요즘엔 시간이 더 많아요. 어떤 일을 하세요?"],["t","I'm a nurse at a hospital.","병원 간호사예요."],["m","That must be hard work.","힘든 일이겠네요."]]},{"t":"생일 이야기","p":[["When is your birthday?","생일이 언제예요?","웬 이즈 유어 버스데이"],["My birthday is in May.","제 생일은 5월이에요.","마이 버스데이 이즈 인 메이"],["We have a family dinner on birthdays.","생일엔 가족끼리 저녁을 먹어요.","위 해브 어 패밀리 디너 온 버스데이즈"],["Happy birthday!","생일 축하해요!","해피 버스데이"],["I hope all your wishes come true.","소원 모두 이루어지길 바라요.","아이 홉 올 유어 위시즈 컴 트루"]],"d":[["t","Today is my birthday!","오늘 제 생일이에요!"],["m","Happy birthday! I hope all your wishes come true.","생일 축하해요! 소원 모두 이루어지길 바라요."],["t","Thank you! When is your birthday?","고마워요! 생일이 언제예요?"],["m","My birthday is in May.","제 생일은 5월이에요."],["t","What do you usually do on your birthday?","생일엔 보통 뭐 해요?"],["m","We have a family dinner on birthdays.","생일엔 가족끼리 저녁을 먹어요."]]},{"t":"가족과 보내는 시간","p":[["We eat dinner together on weekends.","주말엔 같이 저녁을 먹어요.","위 잇 디너 투게더 온 위켄즈"],["My kids are very busy these days.","요즘 아이들이 정말 바빠요.","마이 키즈 아 베리 비지 디즈 데이즈"],["We watch movies at home.","집에서 같이 영화를 봐요.","위 워치 무비즈 앳 홈"],["I call my mother every day.","엄마한테 매일 전화해요.","아이 콜 마이 마더 에브리 데이"],["Family is the most important thing to me.","저한테는 가족이 제일 중요해요.","패밀리 이즈 더 모스트 임포턴트 띵 투 미"]],"d":[["t","What do you do with your family?","가족이랑 뭐 해요?"],["m","We eat dinner together on weekends.","주말엔 같이 저녁을 먹어요."],["t","That's nice.","좋네요."],["m","My kids are very busy these days, but we try.","요즘 아이들이 정말 바쁘지만, 그래도 노력해요."],["t","What about your parents?","부모님은요?"],["m","I call my mother every day.","엄마한테 매일 전화해요."],["t","You're a good daughter.","좋은 딸이네요."],["m","Family is the most important thing to me.","저한테는 가족이 제일 중요해요."]]},{"t":"반려동물","p":[["Do you have any pets?","반려동물 키워요?","두 유 해브 애니 펫츠"],["We have a small dog.","작은 강아지를 키워요.","위 해브 어 스몰 독"],["Her name is Coco.","이름은 코코예요.","허 네임 이즈 코코"],["She's three years old.","세 살이에요.","쉬즈 쓰리 이어즈 올드"],["I walk her twice a day.","하루에 두 번 산책시켜요.","아이 웍 허 트와이스 어 데이"]],"d":[["t","Do you have any pets?","반려동물 키워요?"],["m","Yes. We have a small dog.","네. 작은 강아지를 키워요."],["t","How cute! What's her name?","귀여워라! 이름이 뭐예요?"],["m","Her name is Coco. She's three years old.","이름은 코코예요. 세 살이에요."],["t","Is it hard to take care of her?","돌보기 힘들어요?"],["m","Not really. I walk her twice a day.","별로요. 하루에 두 번 산책시켜요."]]},{"t":"명절 풍경","p":[["We visit my parents on holidays.","명절에 부모님 댁에 가요.","위 비짓 마이 페어런츠 온 할러데이즈"],["The whole family gets together.","온 가족이 모여요.","더 홀 패밀리 겟츠 투게더"],["We cook a lot of food.","음식을 많이 해요.","위 쿡 어 랏 오브 푸드"],["It's tiring, but it's fun.","피곤하지만 재밌어요.","잇츠 타이어링, 벗 잇츠 펀"],["My cousins live far away.","사촌들은 멀리 살아요.","마이 커즌즈 리브 파 어웨이"]],"d":[["t","What do you do on holidays in Korea?","한국에선 명절에 뭐 해요?"],["m","We visit my parents on holidays. The whole family gets together.","명절에 부모님 댁에 가요. 온 가족이 모여요."],["t","Do you cook?","요리도 해요?"],["m","Yes. We cook a lot of food.","네. 음식을 많이 해요."],["t","That sounds like hard work.","힘들겠네요."],["m","It's tiring, but it's fun.","피곤하지만 재밌어요."]]},{"t":"형제자매 이야기","p":[["Do you have any brothers or sisters?","형제자매 있어요?","두 유 해브 애니 브라더스 오어 시스터즈"],["I have one older sister.","언니가 한 명 있어요.","아이 해브 원 올더 시스터"],["We talk on the phone a lot.","전화로 자주 이야기해요.","위 톡 온 더 폰 어 랏"],["She lives in another city.","언니는 다른 도시에 살아요.","쉬 리브즈 인 어나더 시티"],["I miss her sometimes.","가끔 언니가 보고 싶어요.","아이 미스 허 썸타임즈"]],"d":[["t","Do you have any brothers or sisters?","형제자매 있어요?"],["m","I have one older sister.","언니가 한 명 있어요."],["t","Are you close?","친해요?"],["m","Yes. We talk on the phone a lot.","네. 전화로 자주 이야기해요."],["t","Does she live near you?","가까이 살아요?"],["m","No. She lives in another city. I miss her sometimes.","아니요. 다른 도시에 살아요. 가끔 보고 싶어요."]]}]},{"t":"하루 일과","days":[{"t":"아침 일과","p":[["What time do you get up?","몇 시에 일어나요?","왓 타임 두 유 겟 업"],["I usually get up at six thirty.","보통 6시 반에 일어나요.","아이 유주얼리 겟 업 앳 식스 써티"],["I drink a glass of water first.","먼저 물 한 잔 마셔요.","아이 드링크 어 글래스 오브 워러 퍼스트"],["Then I make breakfast for my family.","그다음에 가족 아침을 차려요.","덴 아이 메이크 브렉퍼스트 포 마이 패밀리"],["I'm not a morning person.","저는 아침형 인간이 아니에요.","아임 낫 어 모닝 퍼슨"]],"d":[["t","What time do you get up?","몇 시에 일어나요?"],["m","I usually get up at six thirty.","보통 6시 반에 일어나요."],["t","That's early! What do you do first?","일찍 일어나네요! 제일 먼저 뭐 해요?"],["m","I drink a glass of water first. Then I make breakfast for my family.","먼저 물 한 잔 마셔요. 그다음에 가족 아침을 차려요."],["t","I'm not a morning person.","저는 아침형 인간이 아니에요."],["m","Me neither, but I'm used to it.","저도 아닌데, 익숙해졌어요."]]},{"t":"집안일","p":[["I clean the house in the morning.","아침에 집 청소를 해요.","아이 클린 더 하우스 인 더 모닝"],["My husband does the dishes.","설거지는 남편이 해요.","마이 허즈번드 더즈 더 디쉬즈"],["I do the laundry every other day.","이틀에 한 번 빨래해요.","아이 두 더 런드리 에브리 아더 데이"],["I hate ironing.","다림질은 정말 싫어요.","아이 헤잇 아이어닝"],["Housework never ends.","집안일은 끝이 없어요.","하우스웍 네버 엔즈"]],"d":[["t","How do you share the housework?","집안일은 어떻게 나눠요?"],["m","I clean the house in the morning. My husband does the dishes.","아침에 제가 청소하고, 설거지는 남편이 해요."],["t","What about the laundry?","빨래는요?"],["m","I do the laundry every other day.","이틀에 한 번 빨래해요."],["t","Which chore do you like the least?","어떤 집안일이 제일 싫어요?"],["m","I hate ironing. Housework never ends!","다림질은 정말 싫어요. 집안일은 끝이 없어요!"]]},{"t":"오후 시간","p":[["My afternoons are pretty relaxed.","오후는 꽤 여유로워요.","마이 애프터눈즈 아 프리티 릴랙스드"],["I go to the gym three times a week.","일주일에 세 번 헬스장에 가요.","아이 고 투 더 짐 쓰리 타임즈 어 위크"],["Sometimes I meet my friends for lunch.","가끔 친구들이랑 점심을 먹어요.","썸타임즈 아이 밋 마이 프렌즈 포 런치"],["I take a short nap after lunch.","점심 먹고 잠깐 낮잠을 자요.","아이 테이크 어 숏 냅 애프터 런치"],["I usually have coffee around three.","보통 3시쯤 커피를 마셔요.","아이 유주얼리 해브 커피 어라운드 쓰리"]],"d":[["t","What do you do in the afternoon?","오후엔 뭐 해요?"],["m","My afternoons are pretty relaxed. I go to the gym three times a week.","오후는 꽤 여유로워요. 일주일에 세 번 헬스장에 가요."],["t","Good for you!","대단해요!"],["m","Sometimes I meet my friends for lunch.","가끔 친구들이랑 점심을 먹어요."],["t","Do you drink coffee in the afternoon?","오후에 커피 마셔요?"],["m","Yes. I usually have coffee around three.","네. 보통 3시쯤 커피를 마셔요."]]},{"t":"저녁 시간","p":[["I start cooking dinner at six.","6시에 저녁 준비를 시작해요.","아이 스타트 쿠킹 디너 앳 식스"],["We eat around seven.","7시쯤 먹어요.","위 잇 어라운드 세븐"],["After dinner, I watch TV.","저녁 먹고 TV를 봐요.","애프터 디너, 아이 워치 티비"],["I take a warm bath before bed.","자기 전에 따뜻하게 목욕해요.","아이 테이크 어 웜 배쓰 비포 베드"],["I go to bed around eleven.","11시쯤 자요.","아이 고 투 베드 어라운드 일레븐"]],"d":[["t","What's your evening like?","저녁엔 어떻게 보내요?"],["m","I start cooking dinner at six. We eat around seven.","6시에 저녁 준비를 시작해요. 7시쯤 먹어요."],["t","What do you do after dinner?","저녁 먹고 나서는요?"],["m","After dinner, I watch TV.","저녁 먹고 TV를 봐요."],["t","What time do you go to bed?","몇 시에 자요?"],["m","I go to bed around eleven. I take a warm bath before bed.","11시쯤 자요. 자기 전에 따뜻하게 목욕해요."]]},{"t":"주말 보내기","p":[["What are you doing this weekend?","이번 주말에 뭐 해요?","왓 아 유 두잉 디스 위켄드"],["Nothing special. Just resting at home.","특별한 건 없어요. 그냥 집에서 쉬어요.","낫띵 스페셜. 저스트 레스팅 앳 홈"],["I sleep in on Saturdays.","토요일엔 늦잠을 자요.","아이 슬립 인 온 새러데이즈"],["We often go hiking on Sundays.","일요일엔 자주 등산을 가요.","위 오픈 고 하이킹 온 썬데이즈"],["I clean out the fridge on weekends.","주말엔 냉장고 정리를 해요.","아이 클린 아웃 더 프리지 온 위켄즈"]],"d":[["t","What are you doing this weekend?","이번 주말에 뭐 해요?"],["m","Nothing special. Just resting at home.","특별한 건 없어요. 그냥 집에서 쉬어요."],["t","Do you sleep late?","늦잠 자요?"],["m","Yes. I sleep in on Saturdays.","네. 토요일엔 늦잠을 자요."],["t","What about Sunday?","일요일은요?"],["m","We often go hiking on Sundays.","일요일엔 자주 등산을 가요."]]},{"t":"바쁜 날","p":[["I have a lot to do today.","오늘 할 일이 많아요.","아이 해브 어 랏 투 두 투데이"],["I need to go to the bank and the post office.","은행이랑 우체국에 가야 해요.","아이 니드 투 고 투 더 뱅크 앤 더 포스트 오피스"],["I'm running out of time.","시간이 모자라요.","아임 러닝 아웃 오브 타임"],["Let me check my schedule.","일정 좀 확인해볼게요.","렛 미 체크 마이 스케줄"],["Tomorrow is fine.","내일은 괜찮아요.","투모로우 이즈 파인"]],"d":[["t","Do you want to have coffee?","커피 한잔할래요?"],["m","Sorry, I have a lot to do today.","미안해요, 오늘 할 일이 많아요."],["t","What do you need to do?","뭐 해야 하는데요?"],["m","I need to go to the bank and the post office.","은행이랑 우체국에 가야 해요."],["t","How about tomorrow?","내일은 어때요?"],["m","Let me check my schedule. Tomorrow is fine!","일정 좀 확인해볼게요. 내일은 괜찮아요!"]]},{"t":"물건 찾기","p":[["Where did I put my glasses?","내 안경 어디 뒀더라?","웨어 디드 아이 풋 마이 글래시즈"],["They're on the kitchen table.","식탁 위에 있어요.","데어 온 더 키친 테이블"],["Can you turn on the light?","불 좀 켜줄래요?","캔 유 턴 온 더 라잇"],["Please turn off the TV.","TV 좀 꺼줘요.","플리즈 턴 오프 더 티비"],["The remote control is under the sofa.","리모컨이 소파 밑에 있어요.","더 리못 컨트롤 이즈 언더 더 쏘파"]],"d":[["m","Where did I put my glasses?","내 안경 어디 뒀더라?"],["t","They're on the kitchen table.","식탁 위에 있어요."],["m","Oh, thanks. Can you turn on the light?","아, 고마워요. 불 좀 켜줄래요?"],["t","Sure. Where's the remote control?","그래요. 리모컨 어디 있어요?"],["m","The remote control is under the sofa.","리모컨이 소파 밑에 있어요."],["t","Found it!","찾았다!"],["m","Please turn off the TV. It's too loud.","TV 좀 꺼줘요. 너무 시끄러워요."]]},{"t":"집에 문제가 생겼을 때","p":[["The heater isn't working.","난방기가 안 돼요.","더 히터 이즌트 워킹"],["The sink is clogged.","싱크대가 막혔어요.","더 싱크 이즈 클로그드"],["Could you come and take a look?","와서 좀 봐주실 수 있어요?","쿠쥬 컴 앤 테이크 어 룩"],["When can you come?","언제 오실 수 있어요?","웬 캔 유 컴"],["How much will it cost?","비용은 얼마나 들어요?","하우 머치 윌 잇 코스트"]],"d":[["t","Hello, this is the repair center.","여보세요, 수리 센터입니다."],["m","Hi. The heater isn't working. Could you come and take a look?","안녕하세요. 난방기가 안 돼요. 와서 좀 봐주실 수 있어요?"],["t","Sure. What's your address?","네. 주소가 어떻게 되세요?"],["m","It's apartment three oh two. When can you come?","302호예요. 언제 오실 수 있어요?"],["t","Tomorrow at ten.","내일 10시요."],["m","How much will it cost?","비용은 얼마나 들어요?"],["t","It depends on the problem.","문제에 따라 달라요."]]},{"t":"잠과 휴식","p":[["Did you sleep well?","잘 잤어요?","디쥬 슬립 웰"],["I didn't sleep well last night.","어젯밤에 잠을 잘 못 잤어요.","아이 디든트 슬립 웰 래스트 나잇"],["I woke up three times.","세 번이나 깼어요.","아이 워크 업 쓰리 타임즈"],["I need to get some rest.","좀 쉬어야겠어요.","아이 니드 투 겟 썸 레스트"],["I slept like a baby.","아주 푹 잤어요.","아이 슬렙트 라이크 어 베이비"]],"d":[["t","Did you sleep well?","잘 잤어요?"],["m","No. I didn't sleep well last night. I woke up three times.","아니요. 어젯밤에 잠을 잘 못 잤어요. 세 번이나 깼어요."],["t","Oh no. Maybe it's the hot weather.","저런. 더운 날씨 때문인가 봐요."],["m","Maybe. I need to get some rest.","그런가 봐요. 좀 쉬어야겠어요."],["t","I slept like a baby.","저는 아주 푹 잤어요."],["m","Lucky you!","좋겠네요!"]]},{"t":"오늘 하루 어땠어요?","p":[["How was your day?","오늘 하루 어땠어요?","하우 워즈 유어 데이"],["It was a long day.","긴 하루였어요.","잇 워즈 어 롱 데이"],["My day starts early.","제 하루는 일찍 시작돼요.","마이 데이 스타츠 얼리"],["I'm busiest in the morning.","아침에 제일 바빠요.","아임 비지스트 인 더 모닝"],["In the evening, I finally relax.","저녁엔 드디어 쉬어요.","인 디 이브닝, 아이 파이널리 릴랙스"]],"d":[["t","How was your day?","오늘 하루 어땠어요?"],["m","It was a long day.","긴 하루였어요."],["t","Why? What happened?","왜요? 무슨 일 있었어요?"],["m","Nothing special. My day starts early, and I'm busiest in the morning.","특별한 건 없어요. 제 하루는 일찍 시작되고, 아침에 제일 바빠요."],["t","And now?","지금은요?"],["m","In the evening, I finally relax. How was your day?","저녁엔 드디어 쉬어요. 당신은 오늘 어땠어요?"],["t","Pretty good, thanks.","꽤 좋았어요, 고마워요."]]}]},{"t":"음식과 요리","days":[{"t":"좋아하는 음식","p":[["What's your favorite food?","제일 좋아하는 음식이 뭐예요?","왓츠 유어 페이버릿 푸드"],["I love Korean food, especially kimchi stew.","한식을 좋아해요, 특히 김치찌개요.","아이 러브 코리안 푸드, 이스페셜리 김치 스튜"],["I'm not a picky eater.","저는 입맛이 까다롭지 않아요.","아임 낫 어 피키 이러"],["I can't eat spicy food very well.","매운 음식은 잘 못 먹어요.","아이 캔트 잇 스파이시 푸드 베리 웰"],["I have a sweet tooth.","단 걸 좋아해요.","아이 해브 어 스윗 투쓰"]],"d":[["t","What's your favorite food?","제일 좋아하는 음식이 뭐예요?"],["m","I love Korean food, especially kimchi stew.","한식을 좋아해요, 특히 김치찌개요."],["t","Isn't it spicy?","맵지 않아요?"],["m","A little. But I'm not a picky eater.","조금요. 그래도 저는 입맛이 까다롭지 않아요."],["t","I can't eat spicy food very well.","저는 매운 음식을 잘 못 먹어요."],["m","Then try some Korean desserts. I have a sweet tooth.","그럼 한국 디저트를 드셔보세요. 저는 단 걸 좋아해요."]]},{"t":"요리법 알려주기","p":[["This is my mother's recipe.","이건 우리 엄마 레시피예요.","디스 이즈 마이 마더즈 레서피"],["First, cut the vegetables.","먼저 채소를 썰어요.","퍼스트, 컷 더 베지터블즈"],["Then boil them for ten minutes.","그다음 10분 동안 끓여요.","덴 보일 뎀 포 텐 미닛츠"],["Add a little salt at the end.","마지막에 소금을 조금 넣어요.","애드 어 리틀 솔트 앳 디 엔드"],["I like cooking for my family.","가족을 위해 요리하는 걸 좋아해요.","아이 라이크 쿠킹 포 마이 패밀리"]],"d":[["t","This soup is delicious! How do you make it?","이 수프 맛있어요! 어떻게 만들어요?"],["m","This is my mother's recipe. First, cut the vegetables.","이건 우리 엄마 레시피예요. 먼저 채소를 썰어요."],["t","Okay. And then?","네. 그다음엔요?"],["m","Then boil them for ten minutes.","그다음 10분 동안 끓여요."],["t","That's easy!","쉽네요!"],["m","Add a little salt at the end. I like cooking for my family.","마지막에 소금을 조금 넣어요. 저는 가족을 위해 요리하는 걸 좋아해요."]]},{"t":"맛 표현하기","p":[["This is delicious!","이거 맛있어요!","디스 이즈 딜리셔스"],["It tastes like my mom's cooking.","우리 엄마 음식 맛이 나요.","잇 테이스츠 라이크 마이 맘즈 쿠킹"],["It's a little salty.","조금 짜요.","잇츠 어 리틀 솔티"],["It's too sweet for me.","저한텐 너무 달아요.","잇츠 투 스윗 포 미"],["Can I have some more?","좀 더 먹어도 돼요?","캔 아이 해브 썸 모어"]],"d":[["t","How is the food?","음식 어때요?"],["m","This is delicious! It tastes like my mom's cooking.","이거 맛있어요! 우리 엄마 음식 맛이 나요."],["t","I'm so glad. How's the cake?","다행이에요. 케이크는 어때요?"],["m","It's too sweet for me.","저한텐 너무 달아요."],["t","Ha ha, that's okay.","하하, 괜찮아요."],["m","But the soup is perfect. Can I have some more?","그래도 수프는 완벽해요. 좀 더 먹어도 돼요?"]]},{"t":"식당 예약하기","p":[["Let's eat out tonight.","오늘 저녁엔 외식해요.","렛츠 잇 아웃 투나잇"],["I'd like to make a reservation.","예약하고 싶어요.","아이드 라이크 투 메이크 어 레저베이션"],["For four people at seven, please.","7시에 네 명이요.","포 포 피플 앳 세븐, 플리즈"],["Under the name Lee.","이(Lee)라는 이름으로요.","언더 더 네임 리"],["Do you have a table by the window?","창가 자리 있어요?","두 유 해브 어 테이블 바이 더 윈도우"]],"d":[["t","Thank you for calling. How can I help you?","전화 주셔서 감사합니다. 무엇을 도와드릴까요?"],["m","I'd like to make a reservation. For four people at seven, please.","예약하고 싶어요. 7시에 네 명이요."],["t","Sure. May I have your name?","네. 성함이 어떻게 되세요?"],["m","Under the name Lee. Do you have a table by the window?","이(Lee)라는 이름으로요. 창가 자리 있어요?"],["t","Yes, we do.","네, 있어요."],["m","Great. Thank you.","좋아요. 고마워요."]]},{"t":"식당에서 주문하기","p":[["What's today's special?","오늘의 특선 메뉴가 뭐예요?","왓츠 투데이즈 스페셜"],["I'll have the grilled fish.","생선구이로 할게요.","아일 해브 더 그릴드 피쉬"],["Could I get the dressing on the side?","드레싱은 따로 주실 수 있어요?","쿠다이 겟 더 드레싱 온 더 싸이드"],["No onions, please.","양파는 빼주세요.","노 어니언즈, 플리즈"],["That's all for now.","일단 그거면 돼요.","댓츠 올 포 나우"]],"d":[["t","Are you ready to order?","주문하시겠어요?"],["m","What's today's special?","오늘의 특선 메뉴가 뭐예요?"],["t","Grilled fish with salad.","생선구이와 샐러드예요."],["m","I'll have the grilled fish. Could I get the dressing on the side?","생선구이로 할게요. 드레싱은 따로 주실 수 있어요?"],["t","Of course. Anything else?","물론이죠. 더 필요하신 건요?"],["m","No onions, please. That's all for now.","양파는 빼주세요. 일단 그거면 돼요."]]},{"t":"카페에서 주문하기","p":[["Do you have anything without caffeine?","카페인 없는 거 있어요?","두 유 해브 애니띵 위다웃 캐페인"],["I'll have a decaf latte.","디카페인 라테로 할게요.","아일 해브 어 디캐프 라테"],["Can I get it with less sugar?","설탕 덜 넣어줄 수 있어요?","캔 아이 겟 잇 윗 레스 슈거"],["I'll have a piece of cheesecake, too.","치즈케이크도 한 조각 주세요.","아일 해브 어 피스 오브 치즈케익, 투"],["Let's sit outside.","밖에 앉아요.","렛츠 씻 아웃사이드"]],"d":[["t","What would you like?","뭘로 하시겠어요?"],["m","Do you have anything without caffeine?","카페인 없는 거 있어요?"],["t","We have herbal tea and decaf coffee.","허브티랑 디카페인 커피가 있어요."],["m","I'll have a decaf latte. Can I get it with less sugar?","디카페인 라테로 할게요. 설탕 덜 넣어줄 수 있어요?"],["t","Sure. Anything else?","네. 더 필요하신 건요?"],["m","I'll have a piece of cheesecake, too.","치즈케이크도 한 조각 주세요."]]},{"t":"손님 대접하기","p":[["Please come in.","어서 들어오세요.","플리즈 컴 인"],["Make yourself at home.","편하게 계세요.","메이크 유어셀프 앳 홈"],["Would you like something to drink?","뭐 마실 거 드릴까요?","우쥬 라이크 썸띵 투 드링크"],["I made it myself.","제가 직접 만들었어요.","아이 메이드 잇 마이셀프"],["Help yourself.","마음껏 드세요.","헬프 유어셀프"]],"d":[["m","Please come in. Make yourself at home.","어서 들어오세요. 편하게 계세요."],["t","Thank you for inviting me.","초대해줘서 고마워요."],["m","Would you like something to drink?","뭐 마실 거 드릴까요?"],["t","Just water, please. Wow, look at all this food!","물 주세요. 와, 음식 좀 봐요!"],["m","I made it myself. Help yourself.","제가 직접 만들었어요. 마음껏 드세요."],["t","It all looks delicious!","다 맛있어 보여요!"]]},{"t":"건강하게 먹기","p":[["I'm trying to eat more vegetables.","채소를 더 먹으려고 해요.","아임 트라잉 투 잇 모어 베지터블즈"],["I cut down on coffee.","커피를 줄였어요.","아이 컷 다운 온 커피"],["I eat a lot of fruit.","과일을 많이 먹어요.","아이 잇 어 랏 오브 프룻"],["I try not to eat late at night.","밤늦게는 안 먹으려고 해요.","아이 트라이 낫 투 잇 레잇 앳 나잇"],["Everything in moderation.","뭐든지 적당히가 좋아요.","에브리띵 인 마더레이션"]],"d":[["t","You look healthy these days.","요즘 건강해 보여요."],["m","Thanks. I'm trying to eat more vegetables.","고마워요. 채소를 더 먹으려고 해요."],["t","Do you still drink coffee?","커피는 아직 마셔요?"],["m","I cut down on coffee.","커피를 줄였어요."],["t","What about snacks?","간식은요?"],["m","I eat a lot of fruit. And I try not to eat late at night.","과일을 많이 먹어요. 그리고 밤늦게는 안 먹으려고 해요."],["t","That's a good idea.","좋은 생각이네요."],["m","Everything in moderation!","뭐든지 적당히가 좋아요!"]]},{"t":"한국 음식 소개하기","p":[["Have you ever tried bibimbap?","비빔밥 먹어본 적 있어요?","해브 유 에버 트라이드 비빔밥"],["It's rice mixed with vegetables.","밥에 채소를 비벼 먹는 거예요.","잇츠 라이스 믹스트 윗 베지터블즈"],["You can add hot pepper paste.","고추장을 넣어도 돼요.","유 캔 애드 핫 페퍼 페이스트"],["It's healthy and tasty.","건강하고 맛있어요.","잇츠 헬씨 앤 테이스티"],["I'll cook it for you sometime.","언젠가 만들어줄게요.","아일 쿡 잇 포 유 썸타임"]],"d":[["m","Have you ever tried bibimbap?","비빔밥 먹어본 적 있어요?"],["t","No, what is it?","아니요, 그게 뭐예요?"],["m","It's rice mixed with vegetables. You can add hot pepper paste.","밥에 채소를 비벼 먹는 거예요. 고추장을 넣어도 돼요."],["t","Is it spicy?","매워요?"],["m","Only if you add a lot. It's healthy and tasty.","많이 넣을 때만요. 건강하고 맛있어요."],["t","It sounds wonderful.","정말 좋네요."],["m","I'll cook it for you sometime.","언젠가 만들어줄게요."]]},{"t":"배고플 때","p":[["I'm starving.","배고파 죽겠어요.","아임 스타빙"],["What do you feel like eating?","뭐 먹고 싶어요?","왓 두 유 필 라이크 이링"],["How about noodles?","국수 어때요?","하우 어바웃 누들즈"],["I'm full.","배불러요.","아임 풀"],["That hit the spot.","딱 먹고 싶던 거였어요.","댓 힛 더 스팟"]],"d":[["t","I'm starving.","배고파 죽겠어요."],["m","Me too. What do you feel like eating?","저도요. 뭐 먹고 싶어요?"],["t","I don't know. Something warm.","모르겠어요. 따뜻한 거요."],["m","How about noodles?","국수 어때요?"],["t","Perfect!","좋아요!"],["t","How was it?","어땠어요?"],["m","I'm full. That hit the spot.","배불러요. 딱 먹고 싶던 거였어요."]]}]},{"t":"장보기와 쇼핑","days":[{"t":"마트에서","p":[["Do you have a shopping list?","장보기 목록 있어요?","두 유 해브 어 샤핑 리스트"],["Where can I find the eggs?","달걀은 어디 있어요?","웨어 캔 아이 파인드 디 에그즈"],["They're in aisle five.","5번 통로에 있어요.","데어 인 아일 파이브"],["Is this on sale?","이거 할인하는 거예요?","이즈 디스 온 세일"],["Then I'll take two.","그럼 두 개 살게요.","덴 아일 테이크 투"]],"d":[["t","Do you have a shopping list?","장보기 목록 있어요?"],["m","Yes. First, I need eggs. Where can I find the eggs?","네. 먼저 달걀이 필요해요. 달걀은 어디 있어요?"],["t","They're in aisle five.","5번 통로에 있어요."],["m","Thanks. Oh, is this on sale?","고마워요. 아, 이거 할인하는 거예요?"],["t","Yes. Buy one, get one free.","네. 하나 사면 하나 더 줘요."],["m","Then I'll take two.","그럼 두 개 살게요."]]},{"t":"계산하기","p":[["How much is it all together?","전부 얼마예요?","하우 머치 이즈 잇 올 투게더"],["Can I pay by card?","카드로 계산할 수 있어요?","캔 아이 페이 바이 카드"],["Do you need a bag?","봉투 필요하세요?","두 유 니드 어 백"],["I brought my own bag.","장바구니 가져왔어요.","아이 브롯 마이 오운 백"],["Can I have the receipt?","영수증 주실래요?","캔 아이 해브 더 리씻"]],"d":[["m","How much is it all together?","전부 얼마예요?"],["t","It's thirty-two dollars.","32달러예요."],["m","Can I pay by card?","카드로 계산할 수 있어요?"],["t","Sure. Do you need a bag?","네. 봉투 필요하세요?"],["m","No, thanks. I brought my own bag.","아니요, 괜찮아요. 장바구니 가져왔어요."],["t","Here you go.","여기 있어요."],["m","Can I have the receipt?","영수증 주실래요?"]]},{"t":"옷 사기","p":[["I'm looking for a warm coat.","따뜻한 코트를 찾고 있어요.","아임 루킹 포 어 웜 코트"],["Can I try it on?","입어봐도 돼요?","캔 아이 트라이 잇 온"],["It's a little tight.","조금 껴요.","잇츠 어 리틀 타잇"],["Do you have a larger size?","더 큰 사이즈 있어요?","두 유 해브 어 라저 사이즈"],["This one fits perfectly.","이건 딱 맞아요.","디스 원 핏츠 퍼펙틀리"]],"d":[["t","Can I help you?","도와드릴까요?"],["m","I'm looking for a warm coat.","따뜻한 코트를 찾고 있어요."],["t","How about this one?","이건 어떠세요?"],["m","It's nice. Can I try it on?","예쁘네요. 입어봐도 돼요?"],["t","Of course. How is it?","물론이죠. 어떠세요?"],["m","It's a little tight. Do you have a larger size?","조금 껴요. 더 큰 사이즈 있어요?"],["t","Here's a large.","라지 여기 있어요."],["m","This one fits perfectly.","이건 딱 맞아요."]]},{"t":"가격 묻고 고민하기","p":[["How much is this?","이거 얼마예요?","하우 머치 이즈 디스"],["That's a little expensive.","조금 비싸네요.","댓츠 어 리틀 익스펜시브"],["Is there a cheaper one?","더 싼 거 있어요?","이즈 데어 어 치퍼 원"],["I'll think about it.","생각해볼게요.","아일 띵크 어바웃 잇"],["Okay. I'll take it.","좋아요. 이걸로 살게요.","오케이. 아일 테이크 잇"]],"d":[["m","How much is this?","이거 얼마예요?"],["t","It's eighty dollars.","80달러예요."],["m","That's a little expensive. Is there a cheaper one?","조금 비싸네요. 더 싼 거 있어요?"],["t","This one is fifty dollars.","이건 50달러예요."],["m","Hmm. I'll think about it.","음. 생각해볼게요."],["t","It's very popular. Only two left.","이게 인기 많아요. 두 개 남았어요."],["m","Okay. I'll take it.","좋아요. 이걸로 살게요."]]},{"t":"교환과 환불","p":[["I'd like to return this.","이거 반품하고 싶어요.","아이드 라이크 투 리턴 디스"],["It doesn't fit.","사이즈가 안 맞아요.","잇 더즌트 핏"],["Here's my receipt.","여기 영수증이요.","히어즈 마이 리씻"],["Can I exchange it for a different size?","다른 사이즈로 바꿀 수 있어요?","캔 아이 익스체인지 잇 포 어 디퍼런트 사이즈"],["Can I get a refund?","환불받을 수 있어요?","캔 아이 겟 어 리펀드"]],"d":[["m","Hi. I'd like to return this. It doesn't fit.","안녕하세요. 이거 반품하고 싶어요. 사이즈가 안 맞아요."],["t","Do you have the receipt?","영수증 있으세요?"],["m","Yes. Here's my receipt.","네. 여기 영수증이요."],["t","Would you like a refund or an exchange?","환불하시겠어요, 교환하시겠어요?"],["m","Can I exchange it for a different size?","다른 사이즈로 바꿀 수 있어요?"],["t","Of course.","물론이죠."]]},{"t":"온라인 쇼핑","p":[["I often shop online.","온라인으로 자주 사요.","아이 오픈 샵 온라인"],["It's cheaper and faster.","더 싸고 빨라요.","잇츠 치퍼 앤 패스터"],["I always read the reviews first.","항상 후기를 먼저 읽어요.","아이 올웨이즈 리드 더 리뷰즈 퍼스트"],["My package hasn't arrived yet.","택배가 아직 안 왔어요.","마이 패키지 해즌트 어라이브드 옛"],["I ordered it three days ago.","사흘 전에 주문했어요.","아이 오더드 잇 쓰리 데이즈 어고"]],"d":[["t","Where did you buy that?","그거 어디서 샀어요?"],["m","I often shop online. It's cheaper and faster.","온라인으로 자주 사요. 더 싸고 빨라요."],["t","Is it safe?","안전해요?"],["m","I always read the reviews first.","항상 후기를 먼저 읽어요."],["t","Good idea.","좋은 생각이네요."],["m","But my package hasn't arrived yet. I ordered it three days ago.","그런데 택배가 아직 안 왔어요. 사흘 전에 주문했는데."]]},{"t":"시장에서","p":[["Are these apples fresh?","이 사과 신선해요?","아 디즈 애플즈 프레쉬"],["How much for a bag of apples?","사과 한 봉지에 얼마예요?","하우 머치 포 어 백 오브 애플즈"],["These look really good.","이거 정말 좋아 보여요.","디즈 룩 리얼리 굿"],["Could you give me a discount?","좀 깎아주실 수 있어요?","쿠쥬 기브 미 어 디스카운트"],["I'll come back again.","또 올게요.","아일 컴 백 어게인"]],"d":[["m","Are these apples fresh?","이 사과 신선해요?"],["t","Yes, they came in this morning.","네, 오늘 아침에 들어왔어요."],["m","How much for a bag of apples?","사과 한 봉지에 얼마예요?"],["t","Ten dollars a bag.","한 봉지에 10달러예요."],["m","These look really good. Could you give me a discount?","정말 좋아 보이네요. 좀 깎아주실 수 있어요?"],["t","Okay. Nine dollars.","좋아요. 9달러요."],["m","Thank you! I'll come back again.","고마워요! 또 올게요."]]},{"t":"선물 고르기","p":[["I'm looking for a gift for my friend.","친구 선물을 찾고 있어요.","아임 루킹 포 어 기프트 포 마이 프렌드"],["What would you recommend?","뭘 추천하세요?","왓 우쥬 레커멘드"],["She likes cooking.","친구는 요리하는 걸 좋아해요.","쉬 라익스 쿠킹"],["Could you gift-wrap it?","선물 포장해 주실 수 있어요?","쿠쥬 기프트 랩 잇"],["I hope she likes it.","친구가 마음에 들어 하면 좋겠어요.","아이 홉 쉬 라익스 잇"]],"d":[["m","I'm looking for a gift for my friend. What would you recommend?","친구 선물을 찾고 있어요. 뭘 추천하세요?"],["t","What does she like?","친구분은 뭘 좋아하세요?"],["m","She likes cooking.","친구는 요리하는 걸 좋아해요."],["t","How about this nice pot?","이 예쁜 냄비 어떠세요?"],["m","Perfect. Could you gift-wrap it?","딱 좋아요. 선물 포장해 주실 수 있어요?"],["t","Sure.","그럼요."],["m","Thank you. I hope she likes it.","고마워요. 친구가 마음에 들어 하면 좋겠어요."]]},{"t":"화장품 가게에서","p":[["I'm looking for a face cream.","얼굴 크림을 찾고 있어요.","아임 루킹 포 어 페이스 크림"],["My skin is very dry.","피부가 많이 건조해요.","마이 스킨 이즈 베리 드라이"],["Is this good for sensitive skin?","이거 민감한 피부에도 괜찮아요?","이즈 디스 굿 포 센서티브 스킨"],["Can I try a sample?","샘플 써봐도 돼요?","캔 아이 트라이 어 샘플"],["It smells nice.","향이 좋네요.","잇 스멜즈 나이스"]],"d":[["m","I'm looking for a face cream. My skin is very dry.","얼굴 크림을 찾고 있어요. 피부가 많이 건조해요."],["t","This one is very popular.","이게 인기 많아요."],["m","Is this good for sensitive skin?","이거 민감한 피부에도 괜찮아요?"],["t","Yes, it's very gentle.","네, 아주 순해요."],["m","Can I try a sample?","샘플 써봐도 돼요?"],["t","Of course. Here you go.","물론이죠. 여기요."],["m","Oh, it smells nice.","오, 향이 좋네요."]]},{"t":"쇼핑 이야기하기","p":[["I went shopping yesterday.","어제 쇼핑하러 갔어요.","아이 웬트 샤핑 예스터데이"],["I bought a new pair of shoes.","새 신발을 한 켤레 샀어요.","아이 봇 어 뉴 페어 오브 슈즈"],["They were on sale.","세일 중이었어요.","데이 워 온 세일"],["I got a good deal.","싸게 잘 샀어요.","아이 갓 어 굿 딜"],["I spent too much money.","돈을 너무 많이 썼어요.","아이 스펜트 투 머치 머니"]],"d":[["t","What did you do yesterday?","어제 뭐 했어요?"],["m","I went shopping yesterday. I bought a new pair of shoes.","어제 쇼핑하러 갔어요. 새 신발을 한 켤레 샀어요."],["t","Nice! Were they expensive?","좋네요! 비쌌어요?"],["m","No. They were on sale. I got a good deal.","아니요. 세일 중이었어요. 싸게 잘 샀어요."],["t","Did you buy anything else?","다른 것도 샀어요?"],["m","Yes. I spent too much money!","네. 돈을 너무 많이 썼어요!"]]}]},{"t":"날씨와 기분","days":[{"t":"오늘 날씨","p":[["What's the weather like today?","오늘 날씨 어때요?","왓츠 더 웨더 라이크 투데이"],["It's freezing outside.","밖이 꽁꽁 얼 정도로 추워요.","잇츠 프리징 아웃사이드"],["Yesterday was sunny and warm.","어제는 화창하고 따뜻했어요.","예스터데이 워즈 써니 앤 웜"],["It looks like rain.","비가 올 것 같아요.","잇 룩스 라이크 레인"],["Don't forget your umbrella.","우산 잊지 마세요.","돈트 포겟 유어 엄브렐라"]],"d":[["m","What's the weather like today?","오늘 날씨 어때요?"],["t","It's freezing outside.","밖이 꽁꽁 얼 정도로 추워요."],["m","Really? Yesterday was sunny and warm.","정말요? 어제는 화창하고 따뜻했는데."],["t","And it looks like rain this afternoon.","오후엔 비도 올 것 같아요."],["m","Then I'll take my umbrella.","그럼 우산 챙길게요."],["t","Good. Don't forget your umbrella!","좋아요. 우산 잊지 마세요!"]]},{"t":"좋아하는 계절","p":[["What's your favorite season?","제일 좋아하는 계절이 뭐예요?","왓츠 유어 페이버릿 씨즌"],["I like spring the best.","봄을 제일 좋아해요.","아이 라이크 스프링 더 베스트"],["The flowers are so beautiful.","꽃이 정말 예뻐요.","더 플라워즈 아 쏘 뷰티풀"],["Summer in Korea is hot and humid.","한국의 여름은 덥고 습해요.","써머 인 코리아 이즈 핫 앤 휴미드"],["I can't stand the cold.","추위는 못 참겠어요.","아이 캔트 스탠드 더 콜드"]],"d":[["t","What's your favorite season?","제일 좋아하는 계절이 뭐예요?"],["m","I like spring the best. The flowers are so beautiful.","봄을 제일 좋아해요. 꽃이 정말 예뻐요."],["t","What about summer?","여름은요?"],["m","Summer in Korea is hot and humid.","한국의 여름은 덥고 습해요."],["t","And winter?","겨울은요?"],["m","I can't stand the cold!","추위는 못 참겠어요!"]]},{"t":"기분 말하기","p":[["I'm in a good mood today.","오늘 기분이 좋아요.","아임 인 어 굿 무드 투데이"],["I'm so excited!","너무 신나요!","아임 쏘 익사이티드"],["I'm a bit nervous.","좀 긴장돼요.","아임 어 빗 너버스"],["I feel a little down.","기분이 좀 가라앉아요.","아이 필 어 리틀 다운"],["What's wrong? You look worried.","무슨 일 있어요? 걱정 있어 보여요.","왓츠 롱? 유 룩 워리드"]],"d":[["t","You're smiling a lot today!","오늘 많이 웃네요!"],["m","I'm in a good mood today. My daughter is coming home!","오늘 기분이 좋아요. 딸이 집에 와요!"],["t","That's wonderful!","정말 좋네요!"],["m","I'm so excited! But I'm a bit nervous, too.","너무 신나요! 그런데 좀 긴장도 돼요."],["t","Why?","왜요?"],["m","I want everything to be perfect.","다 완벽했으면 해서요."]]},{"t":"마음 나누기","p":[["I'm sorry to hear that.","그 얘기 들으니 마음이 안 좋네요.","아임 쏘리 투 히어 댓"],["That must be hard.","많이 힘들겠어요.","댓 머스트 비 하드"],["Don't worry. It'll be okay.","걱정 마요. 괜찮을 거예요.","돈트 워리. 이틀 비 오케이"],["I'm here for you.","제가 곁에 있을게요.","아임 히어 포 유"],["I'm happy for you.","잘돼서 저도 기뻐요.","아임 해피 포 유"]],"d":[["t","My mother is in the hospital.","엄마가 입원하셨어요."],["m","I'm sorry to hear that. That must be hard.","마음이 안 좋네요. 많이 힘들겠어요."],["t","Yes. I'm really worried.","네. 정말 걱정돼요."],["m","Don't worry. It'll be okay.","걱정 마요. 괜찮을 거예요."],["t","Thank you.","고마워요."],["m","Call me anytime. I'm here for you.","언제든 전화해요. 제가 곁에 있을게요."]]},{"t":"비 오는 날","p":[["I got caught in the rain.","비를 맞았어요.","아이 갓 콧 인 더 레인"],["I'm soaking wet.","흠뻑 젖었어요.","아임 쏘킹 웻"],["It's pouring outside.","밖에 비가 쏟아져요.","잇츠 포링 아웃사이드"],["Rainy days make me sleepy.","비 오는 날엔 졸려요.","레이니 데이즈 메이크 미 슬리피"],["Let's stay in and have some tea.","집에서 차나 마셔요.","렛츠 스테이 인 앤 해브 썸 티"]],"d":[["t","Oh no! What happened?","어머! 무슨 일이에요?"],["m","I got caught in the rain. I'm soaking wet.","비를 맞았어요. 흠뻑 젖었어요."],["t","It's pouring outside. Here's a towel.","밖에 비가 쏟아지네요. 여기 수건이요."],["m","Thank you. Rainy days make me sleepy.","고마워요. 비 오는 날엔 졸려요."],["t","Me too.","저도요."],["m","Let's stay in and have some tea.","집에서 차나 마셔요."]]},{"t":"더운 날","p":[["It's so hot today.","오늘 정말 덥네요.","잇츠 쏘 핫 투데이"],["I'm sweating a lot.","땀이 많이 나요.","아임 스웨팅 어 랏"],["Can you turn on the air conditioner?","에어컨 좀 켜줄래요?","캔 유 턴 온 디 에어 컨디셔너"],["Let's get something cold to drink.","시원한 거 마시러 가요.","렛츠 겟 썸띵 콜드 투 드링크"],["I can't wait for fall.","가을이 빨리 왔으면 좋겠어요.","아이 캔트 웨잇 포 폴"]],"d":[["m","It's so hot today. I'm sweating a lot.","오늘 정말 덥네요. 땀이 많이 나요."],["t","Me too. It's like a sauna.","저도요. 사우나 같아요."],["m","Can you turn on the air conditioner?","에어컨 좀 켜줄래요?"],["t","Sure.","그래요."],["m","Let's get something cold to drink.","시원한 거 마시러 가요."],["t","Good idea! I can't wait for fall.","좋아요! 가을이 빨리 왔으면 좋겠어요."],["m","Me too.","저도요."]]},{"t":"추운 겨울","p":[["It snowed a lot last night.","어젯밤에 눈이 많이 왔어요.","잇 스노우드 어 랏 래스트 나잇"],["My hands are freezing.","손이 꽁꽁 얼었어요.","마이 핸즈 아 프리징"],["Bundle up. It's cold.","따뜻하게 입어요. 추워요.","번들 업. 잇츠 콜드"],["I always wear a scarf in winter.","겨울엔 항상 목도리를 해요.","아이 올웨이즈 웨어 어 스카프 인 윈터"],["Be careful. The road is icy.","조심해요. 길이 얼었어요.","비 케어풀. 더 로드 이즈 아이시"]],"d":[["t","It snowed a lot last night.","어젯밤에 눈이 많이 왔어요."],["m","I know. My hands are freezing.","그러게요. 손이 꽁꽁 얼었어요."],["t","Bundle up. It's cold.","따뜻하게 입어요. 추워요."],["m","I always wear a scarf in winter.","겨울엔 항상 목도리를 해요."],["t","Be careful. The road is icy.","조심해요. 길이 얼었어요."],["m","Thanks. You too.","고마워요. 당신도요."]]},{"t":"지치고 힘들 때","p":[["I'm exhausted.","완전 지쳤어요.","아임 이그조스티드"],["I've been so stressed lately.","요즘 스트레스를 많이 받았어요.","아이브 빈 쏘 스트레스트 레이틀리"],["I need a break.","좀 쉬어야 해요.","아이 니드 어 브레이크"],["You should take it easy.","좀 쉬엄쉬엄 해요.","유 슈드 테이크 잇 이지"],["Taking a walk helps me relax.","산책하면 마음이 편해져요.","테이킹 어 웍 헬프스 미 릴랙스"]],"d":[["t","You look tired.","피곤해 보여요."],["m","I'm exhausted. I've been so stressed lately.","완전 지쳤어요. 요즘 스트레스를 많이 받았어요."],["t","You should take it easy.","좀 쉬엄쉬엄 해요."],["m","I know. I need a break.","알아요. 좀 쉬어야 해요."],["t","What helps you relax?","뭘 하면 마음이 편해져요?"],["m","Taking a walk helps me relax.","산책하면 마음이 편해져요."]]},{"t":"좋은 소식 전하기","p":[["I have some good news.","좋은 소식이 있어요.","아이 해브 썸 굿 뉴스"],["My son got a job!","아들이 취업했어요!","마이 썬 갓 어 잡"],["Congratulations!","축하해요!","컨그래출레이션즈"],["You must be so happy.","정말 기쁘겠어요.","유 머스트 비 쏘 해피"],["We're going to celebrate tonight.","오늘 저녁에 축하할 거예요.","위아 고잉 투 셀러브레잇 투나잇"]],"d":[["m","I have some good news.","좋은 소식이 있어요."],["t","What is it?","뭔데요?"],["m","My son got a job!","아들이 취업했어요!"],["t","Congratulations! You must be so happy.","축하해요! 정말 기쁘겠어요."],["m","Yes! We're going to celebrate tonight.","네! 오늘 저녁에 축하할 거예요."],["t","Have fun!","즐거운 시간 보내요!"]]},{"t":"날씨와 내 기분","p":[["The weather affects my mood.","날씨가 기분에 영향을 줘요.","더 웨더 어펙츠 마이 무드"],["When it's sunny, I feel energetic.","화창하면 힘이 나요.","웬 잇츠 써니, 아이 필 에너제틱"],["When it's cloudy, I feel lazy.","흐리면 몸이 늘어져요.","웬 잇츠 클라우디, 아이 필 레이지"],["How about you?","당신은 어때요?","하우 어바웃 유"],["I feel the same way.","저도 그래요.","아이 필 더 세임 웨이"]],"d":[["t","What a beautiful day!","날씨 정말 좋네요!"],["m","Yes. The weather affects my mood. When it's sunny, I feel energetic.","네. 날씨가 기분에 영향을 줘요. 화창하면 힘이 나요."],["t","And on cloudy days?","흐린 날엔요?"],["m","When it's cloudy, I feel lazy. How about you?","흐리면 몸이 늘어져요. 당신은 어때요?"],["t","I feel the same way.","저도 그래요."],["m","I think everyone does.","다들 그런가 봐요."]]}]},{"t":"취미와 여가","days":[{"t":"취미가 뭐예요?","p":[["What do you do for fun?","취미가 뭐예요?","왓 두 유 두 포 펀"],["I enjoy gardening.","식물 가꾸는 걸 좋아해요.","아이 인조이 가드닝"],["I grow tomatoes on my balcony.","베란다에서 토마토를 키워요.","아이 그로우 토메이로즈 온 마이 발코니"],["How did you ge p for a painting class.","그림 수업에 등록했어요.","아이 싸인드 업 포 어 페인팅 클래스"],["It starts next Monday.","다음 주 월요일에 시작해요.","잇 스타츠 넥스트 먼데이"],["I've always wanted to learn it.","항상 배우고 싶었어요.","아이브 올웨이즈 원티드 투 런 잇"],["It's never too late to learn.","배우는 데 늦은 때란 없어요.","잇츠 네버 투 레잇 투 런"],["I'm a little nervous, but excited.","좀 떨리지만 설레요.","아임 어 리틀 너버스, 벗 익사이티드"]],"d":[["m","I signed up for a painting class.","그림 수업에 등록했어요."],["t","Really? When does it start?","정말요? 언제 시작해요?"],["m","It starts next Monday. I've always wanted to learn it.","다음 주 월요일에 시작해요. 항상 배우고 싶었어요."],["t","That's great. It's never too late to learn.","잘됐네요. 배우는 데 늦은 때란 없죠."],["m","I'm a little nervous, but excited.","좀 떨리지만 설레요."],["t","You'll do great!","잘할 거예요!"]]},{"t":"영화 보러 가기","p":[["Do you want to see a movie?","영화 볼래요?","두 유 원 투 씨 어 무비"],["What's playing?","뭐 상영해요?","왓츠 플레잉"],["I heard it's really funny.","정말 웃기대요.","아이 허드 잇츠 리얼리 퍼니"],["Let's get popcorn.","팝콘 사요.","렛츠 겟 팝콘"],["That was a great movie!","정말 좋은 영화였어요!","댓 워즈 어 그레잇 무비"]],"d":[["t","Do you want to see a movie?","영화 볼래요?"],["m","Sure. What's playing?","좋아요. 뭐 상영해요?"],["t","There's a new comedy.","새 코미디가 있어요."],["m","I heard it's really funny. Let's go.","정말 웃기대요. 가요."],["t","Should we get snacks?","간식 살까요?"],["m","Yes. Let's get popcorn.","네. 팝콘 사요."],["t","How was the movie?","영화 어땠어요?"],["m","That was a great movie!","정말 좋은 영화였어요!"]]},{"t":"동호회 활동","p":[["I joined a hiking club.","등산 동호회에 가입했어요.","아이 조인드 어 하이킹 클럽"],["We meet every other Saturday.","격주 토요일마다 만나요.","위 밋 에브리 아더 새러데이"],["The members are very friendly.","회원들이 정말 친절해요.","더 멤버즈 아 베리 프렌들리"],["I've made a lot of new friends.","새 친구를 많이 사귀었어요.","아이브 메이드 어 랏 오브 뉴 프렌즈"],["Why don't you join us?","같이 할래요?","와이 돈츄 조인 어스"]],"d":[["m","I joined a hiking club.","등산 동호회에 가입했어요."],["t","Oh, how often do you meet?","오, 얼마나 자주 만나요?"],["m","We meet every other Saturday.","격주 토요일마다 만나요."],["t","Do you like it?","좋아요?"],["m","Yes. The members are very friendly. I've made a lot of new friends.","네. 회원들이 정말 친절해요. 새 친구를 많이 사귀었어요."],["t","That sounds fun.","재밌겠네요."],["m","Why don't you join us?","같이 할래요?"]]},{"t":"공통점 찾기","p":[["I have a lot of hobbies.","취미가 많아요.","아이 해브 어 랏 오브 하비즈"],["I spend my free time outside.","여가 시간엔 밖에 나가요.","아이 스펜드 마이 프리 타임 아웃사이드"],["I'm interested in history.","역사에 관심이 있어요.","아임 인터레스티드 인 히스토리"],["We have a lot in common.","우린 공통점이 많네요.","위 해브 어 랏 인 커먼"],["Let's do it together sometime.","언제 같이 해요.","렛츠 두 잇 투게더 썸타임"]],"d":[["t","What do you do in your free time?","여가 시간엔 뭐 해요?"],["m","I have a lot of hobbies. I spend my free time outside.","취미가 많아요. 여가 시간엔 밖에 나가요."],["t","Me too! I visit museums a lot.","저도요! 박물관에 자주 가요."],["m","Really? I'm interested in history.","정말요? 저는 역사에 관심이 있어요."],["t","We have a lot in common.","우린 공통점이 많네요."],["m","Let's do it together sometime.","언제 같이 해요."]]}]},{"t":"약속과 연락","days":[{"t":"약속 잡기","p":[["Are you free this Friday?","이번 금요일에 시간 있어요?","아 유 프리 디스 프라이데이"],["Let's have lunch together.","같이 점심 먹어요.","렛츠 해브 런치 투게더"],["What time works for you?","몇 시가 좋아요?","왓 타임 웍스 포 유"],["How about twelve thirty?","12시 반 어때요?","하우 어바웃 트웰브 써티"],["Sounds good. See you then.","좋아요. 그때 봐요.","사운즈 굿. 씨 유 덴"]],"d":[["m","Are you free this Friday?","이번 금요일에 시간 있어요?"],["t","Yes, I am. Why?","네, 있어요. 왜요?"],["m","Let's have lunch together.","같이 점심 먹어요."],["t","Great! What time works for you?","좋아요! 몇 시가 좋아요?"],["m","How about twelve thirty?","12시 반 어때요?"],["t","Perfect.","딱 좋아요."],["m","Sounds good. See you then.","좋아요. 그때 봐요."]]},{"t":"만날 장소 정하기","p":[["Where should we meet?","어디서 만날까요?","웨어 슈드 위 밋"],["Do you know the cafe near the bank?","은행 근처 카페 알아요?","두 유 노우 더 카페 니어 더 뱅크"],["Let's meet in front of the station.","역 앞에서 만나요.","렛츠 밋 인 프런트 오브 더 스테이션"],["I'll text you the address.","주소 문자로 보내줄게요.","아일 텍스트 유 디 어드레스"],["Call me when you get there.","도착하면 전화해요.","콜 미 웬 유 겟 데어"]],"d":[["t","Where should we meet?","어디서 만날까요?"],["m","Do you know the cafe near the bank?","은행 근처 카페 알아요?"],["t","No, I don't.","아니요, 몰라요."],["m","Then let's meet in front of the station. I'll text you the address, too.","그럼 역 앞에서 만나요. 주소도 문자로 보내줄게요."],["t","Okay.","알겠어요."],["m","Call me when you get there.","도착하면 전화해요."]]},{"t":"약속 바꾸기","p":[["Something came up.","일이 좀 생겼어요.","썸띵 케임 업"],["Can we meet another day?","다른 날 만날 수 있을까요?","캔 위 밋 어나더 데이"],["Is next Tuesday okay?","다음 주 화요일 괜찮아요?","이즈 넥스트 튜즈데이 오케이"],["Sorry for the trouble.","번거롭게 해서 미안해요.","쏘리 포 더 트러블"],["I'm going to be a little late.","조금 늦을 것 같아요.","아임 고잉 투 비 어 리틀 레잇"]],"d":[["m","Hi, it's me. Something came up. Can we meet another day?","안녕, 저예요. 일이 좀 생겼어요. 다른 날 만날 수 있을까요?"],["t","Sure. When are you free?","그럼요. 언제 시간 돼요?"],["m","Is next Tuesday okay?","다음 주 화요일 괜찮아요?"],["t","Tuesday is fine.","화요일 좋아요."],["m","Thank you. Sorry for the trouble.","고마워요. 번거롭게 해서 미안해요."],["t","No problem.","괜찮아요."]]},{"t":"전화 받기","p":[["Hello? Who's calling, please?","여보세요? 누구세요?","헬로? 후즈 콜링, 플리즈"],["She's not here right now.","지금 자리에 없어요.","쉬즈 낫 히어 라잇 나우"],["Can I take a message?","메시지 남겨드릴까요?","캔 아이 테이크 어 메시지"],["I'll tell her you called.","전화 왔었다고 전할게요.","아일 텔 허 유 콜드"],["Can I speak to Jenny?","제니랑 통화할 수 있을까요?","캔 아이 스픽 투 제니"]],"d":[["m","Hello? Who's calling, please?","여보세요? 누구세요?"],["t","Hi, this is Tom. Can I speak to Jenny?","안녕하세요, 톰이에요. 제니랑 통화할 수 있을까요?"],["m","Sorry, she's not here right now. Can I take a message?","미안해요, 지금 자리에 없어요. 메시지 남겨드릴까요?"],["t","Please ask her to call me back.","다시 전화해달라고 전해주세요."],["m","Okay. I'll tell her you called.","알겠어요. 전화 왔었다고 전할게요."]]},{"t":"전화 걸기","p":[["Hi, this is Hyunsook.","안녕하세요, 현숙이에요.","하이, 디스 이즈 현숙"],["Is this a good time to talk?","지금 통화 괜찮아요?","이즈 디스 어 굿 타임 투 톡"],["I'm calling about tomorrow.","내일 일로 전화했어요.","아임 콜링 어바웃 투모로우"],["Sorry, I can't hear you well.","미안해요, 잘 안 들려요.","쏘리, 아이 캔트 히어 유 웰"],["I'll call you back later.","이따 다시 전화할게요.","아일 콜 유 백 레이러"]],"d":[["m","Hi, this is Hyunsook. Is this a good time to talk?","안녕하세요, 현숙이에요. 지금 통화 괜찮아요?"],["t","Sure. What's up?","그럼요. 무슨 일이에요?"],["m","I'm calling about tomorrow.","내일 일로 전화했어요."],["t","Sorry, I'm on the subway.","미안해요, 지금 지하철이에요."],["m","Sorry, I can't hear you well. I'll call you back later.","미안해요, 잘 안 들려요. 이따 다시 전화할게요."],["t","Okay, thanks!","알겠어요, 고마워요!"]]},{"t":"문자와 메시지","p":[["Did you get my text?","내 문자 받았어요?","디쥬 겟 마이 텍스트"],["Sorry, I didn't see it.","미안해요, 못 봤어요.","쏘리, 아이 디든트 씨 잇"],["My phone was on silent.","휴대폰이 무음이었어요.","마이 폰 워즈 온 사일런트"],["Let me check.","확인해볼게요.","렛 미 체크"],["I'll reply right away.","바로 답장할게요.","아일 리플라이 라잇 어웨이"]],"d":[["t","Did you get my text?","내 문자 받았어요?"],["m","Sorry, I didn't see it. My phone was on silent.","미안해요, 못 봤어요. 휴대폰이 무음이었어요."],["t","I sent you a photo of my new puppy.","새 강아지 사진 보냈어요."],["m","Let me check. Oh, it's so cute!","확인해볼게요. 오, 너무 귀엽다!"],["t","Isn't he?","그렇죠?"],["m","I'll reply right away.","바로 답장할게요."]]},{"t":"초대받았을 때","p":[["Would you like to come?","올래요?","우쥬 라이크 투 컴"],["I'd love to.","좋아요, 꼭 갈게요.","아이드 러브 투"],["Should I bring anything?","뭐 가져갈까요?","슈드 아이 브링 애니띵"],["Just bring yourself.","그냥 몸만 오세요.","저스트 브링 유어셀프"],["What time should I come?","몇 시에 가면 돼요?","왓 타임 슈드 아이 컴"]],"d":[["t","I'm having a small party on Saturday. Would you like to come?","토요일에 작은 파티를 해요. 올래요?"],["m","I'd love to. Should I bring anything?","좋아요, 꼭 갈게요. 뭐 가져갈까요?"],["t","Just bring yourself.","그냥 몸만 오세요."],["m","Okay! What time should I come?","알겠어요! 몇 시에 가면 돼요?"],["t","Around six.","6시쯤이요."],["m","See you on Saturday!","토요일에 봐요!"]]},{"t":"정중하게 거절하기","p":[["Thanks for asking, but I can't.","물어봐줘서 고마운데, 못 가요.","땡스 포 애스킹, 벗 아이 캔트"],["I already have plans.","이미 약속이 있어요.","아이 올레디 해브 플랜즈"],["I wish I could.","저도 그러고 싶은데요.","아이 위쉬 아이 쿠드"],["Maybe next time.","다음에 해요.","메이비 넥스트 타임"],["Let me know about the next one.","다음에 하면 알려줘요.","렛 미 노우 어바웃 더 넥스트 원"]],"d":[["t","We're going to karaoke tonight. Want to come?","오늘 밤 노래방 가요. 같이 갈래요?"],["m","Thanks for asking, but I can't. I already have plans.","물어봐줘서 고마운데, 못 가요. 이미 약속이 있어요."],["t","Oh, that's too bad.","아, 아쉽네요."],["m","I wish I could. Maybe next time.","저도 그러고 싶은데요. 다음에 해요."],["t","Sure!","그래요!"],["m","Let me know about the next one.","다음에 하면 알려줘요."]]},{"t":"가족과 영상통화","p":[["Can you see me?","나 보여?","캔 유 씨 미"],["Your screen is frozen.","화면이 멈췄어.","유어 스크린 이즈 프로즌"],["Can you hear me now?","이제 들려?","캔 유 히어 미 나우"],["I miss you so much.","정말 보고 싶어.","아이 미스 유 쏘 머치"],["Eat well and stay healthy.","잘 먹고 건강하게 지내.","잇 웰 앤 스테이 헬씨"]],"d":[["m","Can you see me?","나 보여?"],["t","Yes, Mom! Hi!","네, 엄마! 안녕!"],["m","Hi, honey. Oh, your screen is frozen.","안녕, 우리 딸. 어, 화면이 멈췄어."],["t","Is it better now?","이제 괜찮아요?"],["m","Yes. I miss you so much.","응. 정말 보고 싶어."],["t","I miss you, too.","저도 보고 싶어요."],["m","Eat well and stay healthy.","잘 먹고 건강하게 지내."]]},{"t":"연락처 주고받기","p":[["It was fun today.","오늘 재밌었어요.","잇 워즈 펀 투데이"],["Let's get together soon.","조만간 한번 만나요.","렛츠 겟 투게더 순"],["What's your phone number?","전화번호가 뭐예요?","왓츠 유어 폰 넘버"],["Text me anytime.","언제든 문자해요.","텍스트 미 애니타임"],["I'll let you know when I'm free.","시간 날 때 알려줄게요.","아일 렛 유 노우 웬 아임 프리"]],"d":[["t","It was fun today!","오늘 재밌었어요!"],["m","Me too. Let's get together soon. What's your phone number?","저도요. 조만간 한번 만나요. 전화번호가 뭐예요?"],["t","Here, I'll type it into your phone.","여기, 제가 휴대폰에 입력해줄게요."],["m","Thanks. Text me anytime.","고마워요. 언제든 문자해요."],["t","You too!","당신도요!"],["m","I'll let you know when I'm free.","시간 날 때 알려줄게요."]]}]},{"t":"건강과 몸","days":[{"t":"몸이 안 좋을 때","p":[["I think I'm catching a cold.","감기 걸리려나 봐요.","아이 띵크 아임 캐칭 어 콜드"],["I have a sore throat.","목이 아파요.","아이 해브 어 쏘어 쓰롯"],["I have a headache, too.","머리도 아파요.","아이 해브 어 헤데익, 투"],["Get well soon.","빨리 나아요.","겟 웰 순"],["I feel much better today.","오늘은 훨씬 나아요.","아이 필 머치 베러 투데이"]],"d":[["t","You don't look well.","안색이 안 좋아요."],["m","I think I'm catching a cold. I have a sore throat.","감기 걸리려나 봐요. 목이 아파요."],["t","Did you see a doctor?","병원 가봤어요?"],["m","Not yet. I have a headache, too.","아직이요. 머리도 아파요."],["t","Go home and rest. Get well soon.","집에 가서 쉬어요. 빨리 나아요."],["t","How are you today?","오늘은 어때요?"],["m","I feel much better today. Thank you.","오늘은 훨씬 나아요. 고마워요."]]},{"t":"병원 예약하기","p":[["I'd like to make an appointment.","진료 예약하고 싶어요.","아이드 라이크 투 메이크 언 어포인트먼트"],["This is my first visit.","처음 방문이에요.","디스 이즈 마이 퍼스트 비짓"],["Is there anything available today?","오늘 가능한 시간 있어요?","이즈 데어 애니띵 어베일러블 투데이"],["I can come in the afternoon.","오후에 갈 수 있어요.","아이 캔 컴 인 디 애프터눈"],["How long is the wait?","얼마나 기다려야 해요?","하우 롱 이즈 더 웨잇"]],"d":[["t","Good morning, Green Clinic.","안녕하세요, 그린 의원입니다."],["m","Hi. I'd like to make an appointment. This is my first visit.","안녕하세요. 진료 예약하고 싶어요. 처음 방문이에요."],["t","Sure. When would you like to come?","네. 언제 오시겠어요?"],["m","Is there anything available today? I can come in the afternoon.","오늘 가능한 시간 있어요? 오후에 갈 수 있어요."],["t","We have an opening at three.","3시에 자리가 있어요."],["m","Great. See you at three.","좋아요. 3시에 갈게요."]]},{"t":"진료받기","p":[["I've had a cough for a week.","일주일째 기침을 해요.","아이브 해드 어 커프 포 어 위크"],["It gets worse at night.","밤에 더 심해져요.","잇 겟츠 워스 앳 나잇"],["I don't have a fever.","열은 없어요.","아이 돈트 해브 어 피버"],["Is it serious?","심각한가요?","이즈 잇 씨리어스"],["How often should I take this?","이거 얼마나 자주 먹어야 해요?","하우 오픈 슈드 아이 테이크 디스"]],"d":[["t","What seems to be the problem?","어디가 불편하세요?"],["m","I've had a cough for a week. It gets worse at night.","일주일째 기침을 해요. 밤에 더 심해져요."],["t","Do you have a fever?","열 있어요?"],["m","No, I don't have a fever. Is it serious?","아니요, 열은 없어요. 심각한가요?"],["t","No, it's just a cold. Take this medicine.","아니요, 그냥 감기예요. 이 약 드세요."],["m","How often should I take this?","이거 얼마나 자주 먹어야 해요?"],["t","Three times a day, after meals.","하루 세 번, 식후에요."]]},{"t":"약국에서","p":[["Do you have something for a cold?","감기약 있어요?","두 유 해브 썸띵 포 어 콜드"],["Does it make you sleepy?","먹으면 졸려요?","더즈 잇 메이크 유 슬리피"],["Should I take it with food?","음식이랑 같이 먹어야 해요?","슈드 아이 테이크 잇 윗 푸드"],["I need some bandages, too.","반창고도 필요해요.","아이 니드 썸 밴디지즈, 투"],["Here's my prescription.","여기 처방전이요.","히어즈 마이 프리스크립션"]],"d":[["m","Hi. Do you have something for a cold?","안녕하세요. 감기약 있어요?"],["t","Yes. This one works well.","네. 이게 잘 들어요."],["m","Does it make you sleepy?","먹으면 졸려요?"],["t","A little. Take it before bed.","조금요. 자기 전에 드세요."],["m","Should I take it with food?","음식이랑 같이 먹어야 해요?"],["t","Yes, after a meal is best.","네, 식후가 제일 좋아요."],["m","Okay. I need some bandages, too.","알겠어요. 반창고도 필요해요."]]},{"t":"다쳤을 때","p":[["I hurt my ankle.","발목을 다쳤어요.","아이 헐트 마이 앵클"],["I slipped on the stairs.","계단에서 미끄러졌어요.","아이 슬립트 온 더 스테어즈"],["It's swollen.","부었어요.","잇츠 스월른"],["It hurts when I walk.","걸으면 아파요.","잇 헐츠 웬 아이 웍"],["I'll put some ice on it.","얼음찜질할게요.","아일 풋 썸 아이스 온 잇"]],"d":[["t","Why are you limping?","왜 절뚝거려요?"],["m","I hurt my ankle. I slipped on the stairs.","발목을 다쳤어요. 계단에서 미끄러졌어요."],["t","Oh no! Let me see.","저런! 좀 봐요."],["m","It's swollen. It hurts when I walk.","부었어요. 걸으면 아파요."],["t","You should see a doctor.","병원에 가봐요."],["m","I will. I'll put some ice on it first.","그럴게요. 먼저 얼음찜질할게요."]]},{"t":"건강 비결","p":[["How do you stay healthy?","건강 비결이 뭐예요?","하우 두 유 스테이 헬씨"],["I stretch every morning.","매일 아침 스트레칭해요.","아이 스트레치 에브리 모닝"],["I try to drink enough water.","물을 충분히 마시려고 해요.","아이 트라이 투 드링크 이너프 워러"],["Sleep is really important.","잠이 정말 중요해요.","슬립 이즈 리얼리 임포턴트"],["I get a checkup every year.","매년 건강검진을 받아요.","아이 겟 어 체크업 에브리 이어"]],"d":[["t","You always look so healthy. How do you stay healthy?","항상 건강해 보여요. 건강 비결이 뭐예요?"],["m","I stretch every morning. And I try to drink enough water.","매일 아침 스트레칭해요. 그리고 물을 충분히 마시려고 해요."],["t","That's simple.","간단하네요."],["m","Sleep is really important, too.","잠도 정말 중요해요."],["t","Do you see a doctor often?","병원은 자주 가요?"],["m","I get a checkup every year.","매년 건강검진을 받아요."]]},{"t":"병문안 가기","p":[["How are you feeling?","몸은 좀 어때요?","하우 아 유 필링"],["I brought you some fruit.","과일 좀 가져왔어요.","아이 브롯 유 썸 프룻"],["You look much better.","훨씬 좋아 보여요.","유 룩 머치 베러"],["When can you go home?","언제 퇴원할 수 있어요?","웬 캔 유 고 홈"],["Take care of yourself.","몸조심해요.","테이크 케어 오브 유어셀프"]],"d":[["m","Hi! How are you feeling?","안녕하세요! 몸은 좀 어때요?"],["t","Much better, thank you.","훨씬 나아요, 고마워요."],["m","I brought you some fruit. You look much better.","과일 좀 가져왔어요. 훨씬 좋아 보여요."],["t","Thank you so much.","정말 고마워요."],["m","When can you go home?","언제 퇴원할 수 있어요?"],["t","Maybe on Friday.","아마 금요일에요."],["m","That's good news. Take care of yourself.","다행이에요. 몸조심해요."]]},{"t":"나이 들면서","p":[["My eyes get tired easily.","눈이 쉽게 피로해져요.","마이 아이즈 겟 타이어드 이질리"],["I need my reading glasses.","돋보기가 필요해요.","아이 니드 마이 리딩 글래시즈"],["My knees hurt on rainy days.","비 오는 날엔 무릎이 아파요.","마이 니즈 헐트 온 레이니 데이즈"],["I'm not as young as I used to be.","예전처럼 젊지 않네요.","아임 낫 애즈 영 애즈 아이 유스트 투 비"],["But I still feel young at heart.","그래도 마음은 아직 젊어요.","벗 아이 스틸 필 영 앳 하트"]],"d":[["t","Can you read this small print?","이 작은 글씨 읽을 수 있어요?"],["m","Not really. I need my reading glasses. My eyes get tired easily.","잘 안 보여요. 돋보기가 필요해요. 눈이 쉽게 피로해져요."],["t","Me too. And my knees hurt on rainy days.","저도요. 그리고 비 오는 날엔 무릎이 아파요."],["m","I'm not as young as I used to be.","예전처럼 젊지 않네요."],["t","Ha ha. Don't say that!","하하. 그런 말 마요!"],["m","But I still feel young at heart.","그래도 마음은 아직 젊어요."]]},{"t":"운동 시작하기","p":[["I'd like to sign up for the gym.","헬스장 등록하고 싶어요.","아이드 라이크 투 싸인 업 포 더 짐"],["How much is a monthly pass?","한 달 이용권은 얼마예요?","하우 머치 이즈 어 먼쓸리 패스"],["Do you have classes for beginners?","초보자 수업 있어요?","두 유 해브 클래시즈 포 비기너즈"],["Can I try it first?","먼저 체험해봐도 돼요?","캔 아이 트라이 잇 퍼스트"],["What time does it open?","몇 시에 문 열어요?","왓 타임 더즈 잇 오픈"]],"d":[["m","Hi. I'd like to sign up for the gym. How much is a monthly pass?","안녕하세요. 헬스장 등록하고 싶어요. 한 달 이용권은 얼마예요?"],["t","It's fifty dollars a month.","한 달에 50달러예요."],["m","Do you have classes for beginners?","초보자 수업 있어요?"],["t","Yes, every morning at nine.","네, 매일 아침 9시에요."],["m","Can I try it first?","먼저 체험해봐도 돼요?"],["t","Of course. Come tomorrow.","물론이죠. 내일 오세요."],["m","What time does it open?","몇 시에 문 열어요?"],["t","At six.","6시요."]]},{"t":"요즘 컨디션","p":[["I've been feeling great lately.","요즘 컨디션이 정말 좋아요.","아이브 빈 필링 그레잇 레이틀리"],["I started swimming last month.","지난달에 수영을 시작했어요. at were you like as a child?","당신은 어렸을 때 어떤 아이였어요?"],["t","I was very shy.","저는 엄청 수줍었어요."]]},{"t":"내 생각 말하기","p":[["What do you think?","어떻게 생각해요?","왓 두 유 띵크"],["I'm not sure about that.","그건 잘 모르겠어요.","아임 낫 슈어 어바웃 댓"],["In my opinion, it's too expensive.","제 생각엔 너무 비싸요.","인 마이 어피니언, 잇츠 투 익스펜시브"],["I think it's a good idea.","좋은 생각인 것 같아요.","아이 띵크 잇츠 어 굿 아이디어"],["I agree with you.","당신 말에 동의해요.","아이 어그리 윗 유"]],"d":[["t","Let's buy a new TV. What do you think?","새 TV 살까요? 어떻게 생각해요?"],["m","I'm not sure about that. In my opinion, it's too expensive.","그건 잘 모르겠어요. 제 생각엔 너무 비싸요."],["t","But our TV is ten years old.","그래도 우리 TV 10년 됐잖아요."],["m","Hmm, that's true.","음, 그건 맞아요."],["t","Let's wait for a sale.","세일할 때까지 기다려요."],["m","I think it's a good idea. I agree with you.","좋은 생각인 것 같아요. 당신 말에 동의해요."]]},{"t":"추천하기","p":[["You should try this restaurant.","이 식당 꼭 가봐요.","유 슈드 트라이 디스 레스토랑"],["I highly recommend it.","강력 추천해요.","아이 하일리 레커멘드 잇"],["It's worth it.","그만한 가치가 있어요.","잇츠 워쓰 잇"],["Go early to avoid the crowds.","사람 몰리기 전에 일찍 가요.","고 얼리 투 어보이드 더 크라우즈"],["You won't regret it.","후회 안 할 거예요.","유 원트 리그렛 잇"]],"d":[["t","I want to eat something special this weekend.","이번 주말에 특별한 걸 먹고 싶어요."],["m","You should try this restaurant. I highly recommend it.","이 식당 꼭 가봐요. 강력 추천해요."],["t","Is it expensive?","비싸요?"],["m","A little, but it's worth it.","조금요, 그래도 그만한 가치가 있어요."],["t","Okay!","좋아요!"],["m","Go early to avoid the crowds. You won't regret it.","사람 몰리기 전에 일찍 가요. 후회 안 할 거예요."]]},{"t":"비교하기","p":[["Which one do you prefer?","어느 쪽이 더 좋아요?","위치 원 두 유 프리퍼"],["They're about the same.","둘이 비슷해요.","데어 어바웃 더 세임"],["It's cheaper, but the quality is lower.","더 싸지만 품질이 떨어져요.","잇츠 치퍼, 벗 더 퀄리티 이즈 로워"],["This one is better than that one.","이게 저것보다 나아요.","디스 원 이즈 베러 댄 댓 원"],["I prefer tea to coffee.","커피보다 차가 좋아요.","아이 프리퍼 티 투 커피"]],"d":[["t","Which one do you prefer, the red one or the blue one?","빨간 거랑 파란 거 중에 어느 쪽이 더 좋아요?"],["m","Hmm, they're about the same.","음, 둘이 비슷해요."],["t","The  return`<div class="today" style="--bg2:${LOOK[d.u][2]}">${uface(d.u)}<p class="tag">오늘의 학습 · Day ${curDay}</p><p class="tt">${d.t}</p><p class="ut">${d.ut} 주제 · 문장 5개</p>${body}</div>`}

function unitsHTML(){const lastU=DAYS[curDay-1].u;const shown=UNITS.map((u,ui)=>ui).filter(ui=>showAll||ui<=lastU);
 return`<div class="units">${shown.map(ui=>`<div class="unit"><h3><span class="dot" style="background:${LOOK[ui][1]}"></span>${UNITS[ui].t} <span class="sub">Day ${ui*10+1}–${ui*10+10}</span></h3><div class="days">${DAYS.slice(ui*10,ui*10+10).map(d=>`<button class="dchip ${doneAt[d.n]?'done':''} ${d.n===curDay&&!doneAt[d.n]?'now':''}" style="--c:${LOOK[ui][1]}" data-act="open" data-n="${d.n}" ${d.n>curDay?'disabled':''} aria-label="Day ${d.n} ${d.t}">${d.n}</button>`).join('')}</div></div>`).join('')}</div>
 ${lastU<UNITS.length-1?`<button class="more" data-act="all">${showAll?'앞으로 배울 주제 접기':'앞으로 배울 주제 모두 보기'}</button>`:''}`}

function home(){stopAll();cur=null;document.body.classList.remove('in');
 $('#app').innerHTML=`<section class="band">${todayCard()}
 <button class="review" data-act="review" ${hard.size?'':'disabled'}><span>어려운 문장 복습</span><span>${hard.size}개</span></button></section>
 <section class="band"><h2 class="h2">지난 학습 다시 보기</h2>${unitsHTML()}</section>
 <section class="band set"><h2 class="h2">설정</h2><div class="setbox">
 <div class="setrow"><label for="rate">말하기 속도</label><select id="rate"><option value="0.6">아주 천천히</option><option value="0.8">천천히</option><option value="1">보통</option></select></div>
 <div class="setrow"><label for="pron">한글 발음 보기</label><input type="checkbox" id="pron"></div></div>
 <p class="note">하루에 한 Day씩 열려요. 오늘 Day를 끝까지(퀴즈까지) 마치면 내일 다음 Day가 열려요. 문장과 대본은 일상 회화용 예시예요.</p></section>`;
 $('#rate').value=String(rate);$('#pron').checked=showPron;stats();window.scrollTo(0,0)}

function reviewSet(){return{t:'어려운 문장 복습',phrases:[...hard].map(k=>PH[k]).filter(Boolean),n:0,u:-1}}
function open(n){stopAll();if(n===0){cur=reviewSet();if(!cur.phrases.length)return home()}else{if(n>curDay)return;cur=DAYS[n-1]}mode='learn';idx=0;lview();window.scrollTo(0,0)}
function lview(){stopAll();document.body.classList.add('in');const tabs=[['learn','문장 익히기']];if(cur.d)tabs.push(['role','상황극']);tabs.push(['quiz',cur.n?'복습 퀴즈':'퀴즈']);
 $('#app').innerHTML=`<section class="band"><button class="back" data-act="home">← 처음으로</button><div class="lvtop">${cur.u>=0?uface(cur.u):face('circle','#ff7a52')}<div>${cur.n?`<p class="sub">Day ${cur.n} · ${cur.ut}</p>`:''}<h2 class="h2">${cur.t}</h2></div></div>
 <div class="tabs">${tabs.map(([k,t])=>`<button class="tab ${mode===k?'on':''}" data-act="mode" data-m="${k}">${t}</button>`).join('')}</div><div id="pane"></div></section>`;
 if(mode==='learn')renderLearn();else if(mode==='quiz')startQuiz();else startRole()}

function renderLearn(){stopAll();const ps=cur.phrases;idx=Math.max(0,Math.min(idx,ps.length-1));const p=ps[idx];if(recUrl){URL.revokeObjectURL(recUrl);recUrl=null}
 const last=idx>=ps.length-1;const nextLabel=!last?'다음 문장':cur.d?'상황극 하기':'퀴즈 풀기';
 $('#pane').innerHTML=`<div class="card"><p class="count">${idx+1} / ${ps.length}</p><p class="en">${p.en}</p>${showPron?`<p class="pr">${p.pr}</p>`:''}<p class="ko">${p.ko}</p>
 <div class="row"><button class="big pri" data-act="say">듣기</button><button class="big" data-act="slow">더 천천히</button></div>
 <button class="big wide sh" data-act="shadow">따라 말하기 3번</button><p class="state" id="shadowState" aria-live="polite">듣고 나서 바로 따라 말해보세요</p>
 <div class="row"><button class="big" data-act="rec" id="recBtn">내 목소리 녹음</button><button class="big" data-act="mine" id="mineBtn" disabled>내 목소리 듣기</button></div>
 <button class="big wide" data-act="check">발음 체크</button><div class="check" id="checkOut" aria-live="polite"></div>
 <button class="star ${hard.has(p.key)?'on':''}" data-act="star">${hard.has(p.key)?'어려운 문장에 담겨 있어요 (빼기)':'어려운 문장으로 담기'}</button></div>
 <div class="nav"><button class="big" data-act="prev" ${idx?'':'disabled'}>이전</button><button class="big pri" data-act="next">${nextLabel}</button></div>`}

function shadow(text){const run=++shadowRun;let n=0;const st=()=>$('#shadowState');
 const step=()=>{if(run!==shadowRun||!st())return;if(n>=3){st().textContent='잘하셨어요! 다시 하려면 한 번 더 누르세요';return}n++;st().textContent=n+'/3 · 잘 들어보세요';const t0=Date.now();
  say(text,rate,()=>{if(run!==shadowRun||!st())return;const wait=Math.max(1800,(Date.now()-t0)*1.5+700);st().textContent=n+'/3 · 지금 따라 말해보세요';setTimeout(step,wait)})};step()}

function setRec(blob){if(recUrl)URL.revokeObjectURL(recUrl);recUrl=URL.createObjectURL(blob);const m=$('#mineBtn');if(m)m.disabled=false;toast('녹음됐어요. "내 목소리 듣기"를 눌러 원래 문장과 비교해보세요')}
async function record(btn){
 if(rec&&rec.state==='recording'){rec.stop();return}
 if(micBlocked||!navigator.mediaDevices||!window.MediaRecorder){$('#fileRec').click();return}
 try{const s=await navigator.mediaDevices.getUserMedia({audio:true});const ch=[];const r=new MediaRecorder(s);rec=r;
  r.ondataavailable=e=>{if(e.data.size)ch.push(e.data)};
  r.onstop=()=>{s.getTracks().forEach(t=>t.stop());const b=$('#recBtn');if(b){b.textContent='다시 녹음';b.classList.remove('live')}if(!r.discard)setRec(new Blob(ch,{type:r.mimeType||'audio/webm'}))};
  r.start();btn.textContent='녹음 멈추기';btn.classList.add('live')}
 catch(err){micBlocked=true;toast('여기선 바로 녹음이 안 돼요. 한 번 더 누르면 휴대폰 녹음기로 녹음할 수 있어요')}}
$('#fileRec').addEventListener('change',e=>{const f=e.target.files&&e.target.files[0];if(f)setRec(f);e.target.value=''});

const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
const NUM={one:'1',two:'2',three:'3',four:'4',five:'5',six:'6',seven:'7',eight:'8',nine:'9',ten:'10',eleven:'11',twelve:'12',twenty:'20',thirty:'30',fifty:'50',eighty:'80',hundred:'100'};
const norm=s=>s.toLowerCase().replace(/wi-?fi/g,'wifi').replace(/['’]/g,'').replace(/[^a-z0-9 ]/g,' ').split(/\s+/).filter(Boolean).map(w=>NUM[w]||w);
function score(target,heard){const h=new Set(norm(heard));const marks=target.split(/\s+/).map(w=>{const k=norm(w)[0];return{w,ok:!k||h.has(k)}});return{pct:Math.round(100*marks.filter(m=>m.ok).length/marks.length),marks,heard}}
function check(text){const out=$('#checkOut');if(!SR){out.innerHTML='<p>이 화면에서는 발음 체크를 쓸 수 없어요.</p>';return}
 let r;try{r=new SR()}catch(e){out.innerHTML='<p>이 화면에서는 발음 체크를 쓸 수 없어요.</p>';return}
 r.lang='en-US';r.interimResults=false;r.maxAlternatives=3;out.innerHTML='<p class="pct">듣고 있어요… 말해보세요</p>';
 r.onresult=e=>{const alts=[...e.results[0]].map(a=>a.transcript);const b=alts.map(a=>score(text,a)).sort((x,y)=>y.pct-x.pct)[0];
  out.innerHTML=`<p class="pct">${b.pct===100?'완벽해요!':b.pct>=70?'좋아요! 거의 다 왔어요':'한 번 더 해볼까요?'}</p><p>${b.marks.map(m=>m.ok?esc(m.w):`<span class="bad">${esc(m.w)}</span>`).join(' ')}</p><p class="ko">들린 말: ${esc(b.heard)}</p>`};
 r.onerror=e=>{out.innerHTML=/not-allowed/.test(e.error)?'<p>이 화면에서는 마이크를 쓸 수 없어요. 듣기와 따라 말하기로 연습해 주세요.</p>':'<p>잘 못 들었어요. 조금 크게 다시 말해볼까요?</p>'};
 try{r.start()}catch(e){out.innerHTML='<p>잠시 후 다시 눌러주세요.</p>'}}

function quizSet(){if(!cur.n)return shuffle(cur.phrases.slice());
 const own=cur.phrases.slice();const prev=DAYS.slice(0,cur.n-1).flatMap(d=>d.phrases);
 const hardPrev=shuffle(prev.filter(p=>hard.has(p.key)));const rest=shuffle(prev.filter(p=>!hard.has(p.key)));
 const extra=hardPrev.concat(rest).slice(0,Math.min(5,prev.length));return shuffle(own.concat(extra))}
function startQuiz(){qo=quizSet();qi=0;qRight=0;qShown=false;renderQuiz()}
function finishDay(){markDay();if(!cur.n)return'';
 if(!doneAt[cur.n]){doneAt[cur.n]=TODAY();store.set('doneAt',doneAt)}
 if(cur.n===curDay)return curDay<TOTAL?`Day ${cur.n} 완료! 내일 Day ${cur.n+1} 학습이 열려요.`:'100일 코스 완주! 정말 대단해요!';
 return`Day ${cur.n} 복습 완료!`}
function renderQuiz(){stopAll();const pane=$('#pane');
 if(qi>=qo.length){const msg=finishDay();pane.innerHTML=`<div class="card"><p class="en">수고하셨어요!</p><p class="ko">${qo.length}문장 중 ${qRight}문장을 맞혔어요.${qRight<qo.length?' 헷갈린 문장은 복습에 담아뒀어요.':''}</p>${msg?`<p class="msg" style="font-weight:700;margin:12px 0 0">${msg}</p>`:''}
  <div class="row"><button class="big" data-act="qagain">다시 풀기</button><button class="big pri" data-act="home">처음으로</button></div></div>`;return}
 const p=qo[qi];const old=cur.n&&!p.key.startsWith(cur.n+'-');
 pane.innerHTML=`<div class="card"><p class="count">${qi+1} / ${qo.length}${old?' · 지난 문장':''}</p><p class="lab">영어로 소리 내어 말해보세요</p><p class="big-ko">${p.ko}</p>
 ${qShown?`<p class="en">${p.en}</p>${showPron?`<p class="pr">${p.pr}</p>`:''}<button class="big wide" data-act="say">한 번 더 듣기</button><div class="row"><button class="big" data-act="qwrong">헷갈렸어요</button><button class="big ok" data-act="qright">맞혔어요</button></div>`:'<button class="big wide pri" data-act="reveal">말했어요, 정답 보기</button>'}</div>`}

function startRole(){ri=0;rShown=false;renderRole()}
function bubble(l){const me=l[0]==='m';return`<div class="bub ${me?'me':'them'}"><p class="who">${me?'나':'상대'}</p><p class="en sm">${l[1]}</p><p class="ko">${l[2]}</p></div>`}
function renderRole(){stopAll();const d=cur.d;const hist=d.slice(0,ri).map(bubble).join('');let html;
 if(ri>=d.length)html=`<div class="card"><p class="en">대화 완성!</p><p class="ko">이제 복습 퀴즈로 마무리해요.</p><div class="row"><button class="big" data-act="ragain">처음부터 다시</button><button class="big pri" data-act="mode" data-m="quiz">퀴즈 풀기</button></div></div>`;
 else{const l=d[ri];
  if(l[0]==='t')html=bubble(l)+'<div class="row"><button class="big" data-act="say">다시 듣기</button><button class="big pri" data-act="rnext">다음</button></div>';
  else html=`<div class="bub ask"><p class="lab">내 차례 · 영어로 말해보세요</p><p class="big-ko">${l[2]}</p>${rShown?`<p class="en sm">${l[1]}</p>${showPron&&PR[l[1]]?`<p class="pr">${PR[l[1]]}</p>`:''}`:''}</div>
  <div class="row">${rShown?'<button class="big" data-act="say">다시 듣기</button><button class="big pri" data-act="rnext">다음</button>':'<button class="big wide pri" data-act="rshow">말했어요, 정답 보기</button>'}</div>`}
 $('#pane').innerHTML=`<div class="chat">${hist}${html}</div>`;
 const last=$('#pane .row:last-child')||$('#pane .card');if(last&&ri>0)last.scrollIntoView({block:'end',behavior:'smooth'});
 if(ri<d.length&&d[ri][0]==='t')say(d[ri][1])}

function curText(){if(mode==='learn')return cur.phrases[idx].en;if(mode==='quiz')return qo[qi]?qo[qi].en:'';const l=cur.d[ri];return l?l[1]:''}

document.addEventListener('click',e=>{const b=e.target.closest('[data-act]');if(!b||b.disabled)return;
 switch(b.dataset.act){
 case'home':home();break;
 case'open':open(+b.dataset.n);break;
 case'review':open(0);break;
 case'all':showAll=!showAll;home();break;
 case'mode':mode=b.dataset.m;lview();break;
 case'say':say(curText());break;
 case'slow':say(curText(),Math.max(0.45,rate-0.25));break;
 case'shadow':shadow(curText());break;
 case'rec':record(b);break;
 case'mine':if(recUrl){new Audio(recUrl).play().catch(()=>toast('재생이 안 됐어요. 다시 눌러주세요'))}break;
 case'check':check(curText());break;
 case'star':{const k=cur.phrases[idx].key;if(hard.has(k))hard.delete(k);else hard.add(k);saveHard();renderLearn();break}
 case'prev':idx--;renderLearn();break;
 case'next':if(idx<cur.phrases.length-1){idx++;renderLearn()}else{mode=cur.d?'role':'quiz';lview()}window.scrollTo(0,0);break;
 case'reveal':qShown=true;renderQuiz();say(qo[qi].en);break;
 case'qright':qRight++;if(!cur.n){hard.delete(qo[qi].key);saveHard()}qi++;qShown=false;renderQuiz();break;
 case'qwrong':hard.add(qo[qi].key);saveHard();qi++;qShown=false;renderQuiz();break;
 case'qagain':startQuiz();break;
 case'rshow':rShown=true;renderRole();say(cur.d[ri][1]);break;
 case'rnext':ri++;rShown=false;renderRole();break;
 case'ragain':startRole();break;
 }});
document.addEventListener('change',e=>{if(e.target.id==='rate'){rate=+e.target.value;store.set('rate',rate);say('This is the speed.',rate)}if(e.target.id==='pron'){showPron=e.target.checked;store.set('pron',showPron)}});
$('#cheerFace').innerHTML=face('circle','#ffc83d');
home();

}
</script></body></html>
